<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 1160" role="img" aria-label="Ops Signals data flows from Prometheus and CSV sources through a Universal Router, a bounded analyzer registry with an optional AI second opinion, into single-metric Findings and cross-metric Behavior Findings. Both can be promoted to a Case with a recorded outcome, which persists to PostgreSQL and embeds into Qdrant. Three implemented consumers read from that shared store without writing back to it: an external Intelligent Alert Manager, the in-app Ask Ops Signals assistant, and Grafana dashboards. Kubernetes, cloud-provider, and OpenTelemetry sources, plus ITSM/automation and external-system consumers, are shown separately as planned, not yet implemented.">
  <style>
    text { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #14181f; }
    .box-title { font-weight: 600; }
    .box-sub { fill: #5b6472; }
    .arrow-label { fill: #35404d; }
    .stage-num { font-weight: 600; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>

  <rect x="0" y="0" width="1420" height="1160" fill="#ffffff"></rect>

      <text x="720" y="20" text-anchor="middle" font-size="9.5" letter-spacing="0.05em" fill="#7b8794">PLANNED — NOT YET IMPLEMENTED</text>

      <g style="color:#7b8794">
        <rect x="190" y="28" width="220" height="42" rx="8" fill="#f5f6f7" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 4"></rect>
        <text x="300" y="45" text-anchor="middle" font-size="10.5" class="box-title">Kubernetes</text>
        <text x="300" y="58" text-anchor="middle" font-size="8.5" class="box-sub">kube-state-metrics · cAdvisor</text>

        <rect x="600" y="28" width="220" height="42" rx="8" fill="#f5f6f7" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 4"></rect>
        <text x="710" y="45" text-anchor="middle" font-size="10.5" class="box-title">Cloud Providers</text>
        <text x="710" y="58" text-anchor="middle" font-size="8.5" class="box-sub">AWS · GCP · Azure metrics</text>

        <rect x="1010" y="28" width="220" height="42" rx="8" fill="#f5f6f7" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 4"></rect>
        <text x="1120" y="45" text-anchor="middle" font-size="10.5" class="box-title">OpenTelemetry</text>
        <text x="1120" y="58" text-anchor="middle" font-size="8.5" class="box-sub">OTel Collector</text>
      </g>

  <g transform="translate(0,90)">

      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" style="fill:#14181f"></path>
        </marker>
        <marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" style="fill:#6d5dfc"></path>
        </marker>
        <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" style="fill:#b45309"></path>
        </marker>
      </defs>

      <!-- stage numbers -->
      <g style="color:#5b6472">
        <circle cx="30" cy="162" r="13" fill="none" stroke="currentColor" stroke-width="1.3"></circle>
        <text x="30" y="166" text-anchor="middle" font-size="11" class="stage-num">1</text>
        <circle cx="30" cy="340" r="13" fill="none" stroke="currentColor" stroke-width="1.3"></circle>
        <text x="30" y="344" text-anchor="middle" font-size="11" class="stage-num">2</text>
        <circle cx="30" cy="516" r="13" fill="none" stroke="currentColor" stroke-width="1.3"></circle>
        <text x="30" y="520" text-anchor="middle" font-size="11" class="stage-num">3</text>
        <circle cx="30" cy="638" r="13" fill="none" stroke="currentColor" stroke-width="1.3"></circle>
        <text x="30" y="642" text-anchor="middle" font-size="11" class="stage-num">4</text>
        <circle cx="30" cy="763" r="13" fill="none" stroke="currentColor" stroke-width="1.3"></circle>
        <text x="30" y="767" text-anchor="middle" font-size="11" class="stage-num">5</text>
        <circle cx="30" cy="920" r="13" fill="none" stroke="currentColor" stroke-width="1.3"></circle>
        <text x="30" y="924" text-anchor="middle" font-size="11" class="stage-num">6</text>
      </g>

      <!-- ================= SOURCES ================= -->
      <rect x="400" y="24" width="280" height="54" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="540" y="47" text-anchor="middle" font-size="13" class="box-title">Prometheus</text>
      <text x="540" y="63" text-anchor="middle" font-size="10.5" class="box-sub">pull · scrape</text>

      <rect x="760" y="24" width="280" height="54" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="900" y="47" text-anchor="middle" font-size="13" class="box-title">CSV Upload</text>
      <text x="900" y="63" text-anchor="middle" font-size="10.5" class="box-sub">batch · validated</text>

      <line x1="540" y1="78" x2="712" y2="130" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>
      <line x1="900" y1="78" x2="728" y2="130" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>

      <!-- ================= STAGE 1: INGEST ================= -->
      <rect x="530" y="132" width="380" height="60" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="720" y="157" text-anchor="middle" font-size="13" class="box-title">Ingest &amp; Normalize</text>
      <text x="720" y="174" text-anchor="middle" font-size="10.5" class="box-sub">provider mapping → canonical schema</text>

      <line x1="720" y1="192" x2="720" y2="248" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>
      <text x="734" y="223" font-size="10.5" class="arrow-label">normalized points</text>

      <!-- ================= STAGE 2: ROUTE + ANALYZE ================= -->
      <rect x="550" y="250" width="340" height="60" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="720" y="275" text-anchor="middle" font-size="13" class="box-title">Universal Router</text>
      <text x="720" y="292" text-anchor="middle" font-size="10.5" class="box-sub">feature extraction + series profiling</text>

      <line x1="720" y1="310" x2="720" y2="364" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>
      <text x="734" y="340" font-size="10.5" class="arrow-label">scored analyzer picks</text>

      <rect x="530" y="366" width="380" height="64" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="720" y="389" text-anchor="middle" font-size="13" class="box-title">Analyzer Registry</text>
      <text x="720" y="405" text-anchor="middle" font-size="10.5" class="box-sub">bounded, deterministic algorithms</text>
      <text x="720" y="418" text-anchor="middle" font-size="10.5" class="box-sub">anomaly · trend · shift · forecast</text>

      <!-- AI second opinion (optional, advisory) -->
      <g style="color:#6d5dfc">
        <line x1="890" y1="280" x2="978" y2="396" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow-purple)"></line>
        <rect x="902" y="327" width="62" height="14" fill="#ffffff"></rect>
        <text x="905" y="335" font-size="10" class="arrow-label">same input</text>

        <rect x="980" y="366" width="260" height="64" rx="10" fill="#f2f0ff" stroke="currentColor" stroke-width="1.6" stroke-dasharray="5 4"></rect>
        <text x="1110" y="393" text-anchor="middle" font-size="12.5" class="box-title">AI Second Opinion</text>
        <text x="1110" y="410" text-anchor="middle" font-size="10" class="box-sub">independent pick (optional)</text>

        <line x1="1108" y1="430" x2="912" y2="398" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow-purple)"></line>
        <text x="985" y="450" font-size="10" class="arrow-label">advisory — never overrides router</text>
      </g>

      <!-- ================= STAGE 3: FIND + CORRELATE ================= -->
      <line x1="655" y1="430" x2="530" y2="484" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>
      <text x="500" y="463" text-anchor="end" font-size="10.5" class="arrow-label">per-metric signal</text>

      <line x1="785" y1="430" x2="910" y2="484" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>
      <text x="925" y="463" font-size="10.5" class="arrow-label">cross-metric facts</text>

      <rect x="380" y="486" width="260" height="60" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="510" y="511" text-anchor="middle" font-size="13" class="box-title">Findings</text>
      <text x="510" y="528" text-anchor="middle" font-size="10.5" class="box-sub">single-metric</text>

      <rect x="760" y="486" width="380" height="60" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="950" y="511" text-anchor="middle" font-size="13" class="box-title">Behavior Intelligence Engine</text>
      <text x="950" y="528" text-anchor="middle" font-size="10.5" class="box-sub">cross-metric correlation rules</text>

      <!-- ================= STAGE 4: CASE LIFECYCLE ================= -->
      <line x1="530" y1="546" x2="680" y2="604" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>
      <line x1="930" y1="546" x2="762" y2="604" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>
      <rect x="617" y="577" width="206" height="15" fill="#ffffff"></rect>
      <text x="720" y="586" text-anchor="middle" font-size="10.5" class="arrow-label">promote to case (either source)</text>

      <rect x="490" y="606" width="460" height="64" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="720" y="631" text-anchor="middle" font-size="13" class="box-title">Case Lifecycle</text>
      <text x="720" y="648" text-anchor="middle" font-size="10.5" class="box-sub">investigation → RCA → resolution → recorded outcome</text>

      <!-- ================= STAGE 5: PERSIST ================= -->
      <line x1="650" y1="670" x2="490" y2="724" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>
      <line x1="790" y1="670" x2="950" y2="724" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>
      <text x="720" y="702" text-anchor="middle" font-size="10.5" class="arrow-label">persist</text>

      <rect x="280" y="726" width="360" height="74" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="460" y="753" text-anchor="middle" font-size="13.5" class="box-title">PostgreSQL</text>
      <text x="460" y="770" text-anchor="middle" font-size="10.5" class="box-sub">system of record</text>
      <text x="460" y="784" text-anchor="middle" font-size="10.5" class="box-sub">signals · findings · cases · learning outcomes</text>

      <rect x="800" y="726" width="360" height="74" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="980" y="753" text-anchor="middle" font-size="13.5" class="box-title">Qdrant</text>
      <text x="980" y="770" text-anchor="middle" font-size="10.5" class="box-sub">semantic index</text>
      <text x="980" y="784" text-anchor="middle" font-size="10.5" class="box-sub">case / finding / behavior embeddings</text>

      <line x1="640" y1="763" x2="798" y2="763" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"></line>
      <text x="719" y="757" text-anchor="middle" font-size="10" class="arrow-label">embed (deterministic text)</text>

      <!-- ================= BOUNDARY ================= -->
      <line x1="40" y1="850" x2="1380" y2="850" stroke="currentColor" stroke-width="1" stroke-dasharray="2 5" opacity="0.5"></line>
      <rect x="1180" y="838" width="200" height="24" rx="12" fill="#ffffff" stroke="currentColor" stroke-width="1" opacity="0.9"></rect>
      <text x="1280" y="854" text-anchor="middle" font-size="10" letter-spacing="0.03em" opacity="0.75">READ&#8209;ONLY BOUNDARY</text>

      <!-- bus from stores to consumers -->
      <line x1="460" y1="800" x2="460" y2="815" stroke="currentColor" stroke-width="1.2"></line>
      <line x1="980" y1="800" x2="980" y2="815" stroke="currentColor" stroke-width="1.2"></line>
      <line x1="280" y1="815" x2="1140" y2="815" stroke="currentColor" stroke-width="1.2"></line>

      <line x1="280" y1="815" x2="280" y2="878" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>
      <line x1="710" y1="815" x2="710" y2="878" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>
      <line x1="1140" y1="815" x2="1140" y2="878" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>

      <!-- ================= STAGE 6: CONSUMERS ================= -->
      <g style="color:#b45309">
        <rect x="90" y="880" width="380" height="80" rx="10" fill="#fff4e5" stroke="currentColor" stroke-width="1.7"></rect>
        <text x="280" y="906" text-anchor="middle" font-size="13" class="box-title">Intelligent Alert Manager</text>
        <text x="280" y="922" text-anchor="middle" font-size="10" class="box-sub">external system · pre-alert consult</text>
        <text x="280" y="936" text-anchor="middle" font-size="10" class="box-sub">outcomes · similar cases · recurrence</text>
        <rect x="204" y="863" width="152" height="16" fill="#ffffff"></rect>
        <text x="280" y="873" text-anchor="middle" font-size="10" class="mono">GET /api/alert-context</text>
      </g>

      <rect x="560" y="880" width="300" height="80" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="710" y="912" text-anchor="middle" font-size="13" class="box-title">Ask Ops Signals</text>
      <text x="710" y="929" text-anchor="middle" font-size="10.5" class="box-sub">chat assistant</text>
      <rect x="650" y="863" width="120" height="16" fill="#ffffff"></rect>
      <text x="710" y="873" text-anchor="middle" font-size="10" class="arrow-label">semantic + keyword</text>

      <rect x="950" y="880" width="380" height="80" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="1140" y="912" text-anchor="middle" font-size="13" class="box-title">Grafana Plugin &amp; Dashboards</text>
      <text x="1140" y="929" text-anchor="middle" font-size="10.5" class="box-sub">operator UI</text>
      <rect x="1062" y="863" width="156" height="16" fill="#ffffff"></rect>
      <text x="1140" y="873" text-anchor="middle" font-size="10" class="arrow-label">panels + recommendations</text>
    
  </g>

      <text x="720" y="1075" text-anchor="middle" font-size="9.5" letter-spacing="0.05em" fill="#7b8794">PLANNED — NOT YET IMPLEMENTED</text>

      <g style="color:#7b8794">
        <rect x="250" y="1085" width="340" height="48" rx="8" fill="#f5f6f7" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 4"></rect>
        <text x="420" y="1105" text-anchor="middle" font-size="11" class="box-title">Automation / ITSM</text>
        <text x="420" y="1120" text-anchor="middle" font-size="9" class="box-sub">Jira · ServiceNow — create/update tickets</text>

        <rect x="830" y="1085" width="340" height="48" rx="8" fill="#f5f6f7" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 4"></rect>
        <text x="1000" y="1105" text-anchor="middle" font-size="11" class="box-title">External Systems</text>
        <text x="1000" y="1120" text-anchor="middle" font-size="9" class="box-sub">APIs · webhooks — BI/reporting</text>
      </g>

</svg>
