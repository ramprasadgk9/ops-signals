<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 1250" role="img" aria-label="Ops Signals data flows from Prometheus, CSV, and OTLP sources through a Universal Router, a bounded analyzer registry with an optional AI second opinion, into single-metric Findings and cross-metric Behavior Findings. Both can be promoted to a Case with a recorded outcome, which persists to PostgreSQL and embeds into Qdrant; CI/CD change events are recorded in PostgreSQL too. Consumers read from that shared store: built-in Alert Enrichment (Alertmanager alerts in, one enriched Slack message out, which also triggers analysis of the alerting series on demand), the external alert-context API, the in-app Ask Ops Signals assistant, and the Grafana plugin. Slack receives enriched alerts and high-importance finding notifications. Kubernetes and cloud-provider sources, plus ITSM/automation and generic external-system consumers, are shown separately as planned, not yet implemented.">
  <style>
    text { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #14181f; }
    .box-title { font-weight: 600; }
    .box-sub { fill: #5b6472; }
    .arrow-label { fill: #35404d; }
    .stage-num { font-weight: 600; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>

  <rect x="0" y="0" width="1420" height="1250" fill="#ffffff"></rect>

      <text x="720" y="20" text-anchor="middle" font-size="9.5" letter-spacing="0.05em" fill="#7b8794">PLANNED — NOT YET IMPLEMENTED</text>

      <g style="color:#7b8794">
        <rect x="380" y="28" width="220" height="42" rx="8" fill="#f5f6f7" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 4"></rect>
        <text x="490" y="45" text-anchor="middle" font-size="10.5" class="box-title">Kubernetes</text>
        <text x="490" y="58" text-anchor="middle" font-size="8.5" class="box-sub">kube-state-metrics · cAdvisor</text>

        <rect x="840" y="28" width="220" height="42" rx="8" fill="#f5f6f7" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 4"></rect>
        <text x="950" y="45" text-anchor="middle" font-size="10.5" class="box-title">Cloud Providers</text>
        <text x="950" y="58" text-anchor="middle" font-size="8.5" class="box-sub">AWS · GCP · Azure metrics</text>
      </g>

  <g transform="translate(0,90)">

      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" style="fill:#14181f"></path>
        </marker>
        <marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" style="fill:#6d5dfc"></path>
        </marker>
        <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" style="fill:#b45309"></path>
        </marker>
      </defs>

      <!-- stage numbers -->
      <g style="color:#5b6472">
        <circle cx="30" cy="162" r="13" fill="none" stroke="currentColor" stroke-width="1.3"></circle>
        <text x="30" y="166" text-anchor="middle" font-size="11" class="stage-num">1</text>
        <circle cx="30" cy="340" r="13" fill="none" stroke="currentColor" stroke-width="1.3"></circle>
        <text x="30" y="344" text-anchor="middle" font-size="11" class="stage-num">2</text>
        <circle cx="30" cy="516" r="13" fill="none" stroke="currentColor" stroke-width="1.3"></circle>
        <text x="30" y="520" text-anchor="middle" font-size="11" class="stage-num">3</text>
        <circle cx="30" cy="638" r="13" fill="none" stroke="currentColor" stroke-width="1.3"></circle>
        <text x="30" y="642" text-anchor="middle" font-size="11" class="stage-num">4</text>
        <circle cx="30" cy="769" r="13" fill="none" stroke="currentColor" stroke-width="1.3"></circle>
        <text x="30" y="773" text-anchor="middle" font-size="11" class="stage-num">5</text>
        <circle cx="30" cy="920" r="13" fill="none" stroke="currentColor" stroke-width="1.3"></circle>
        <text x="30" y="924" text-anchor="middle" font-size="11" class="stage-num">6</text>
      </g>

      <!-- ================= SOURCES ================= -->
      <rect x="320" y="24" width="240" height="54" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="440" y="47" text-anchor="middle" font-size="13" class="box-title">Prometheus</text>
      <text x="440" y="63" text-anchor="middle" font-size="10.5" class="box-sub">pull · scrape · autonomous schedule</text>

      <rect x="600" y="24" width="240" height="54" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="720" y="47" text-anchor="middle" font-size="13" class="box-title">CSV Upload</text>
      <text x="720" y="63" text-anchor="middle" font-size="10.5" class="box-sub">batch · validated</text>

      <rect x="880" y="24" width="240" height="54" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="1000" y="47" text-anchor="middle" font-size="13" class="box-title">OTLP Metrics</text>
      <text x="1000" y="63" text-anchor="middle" font-size="10.5" class="box-sub">OTLP/HTTP push · buffered</text>

      <line x1="440" y1="78" x2="700" y2="130" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>
      <line x1="720" y1="78" x2="720" y2="130" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>
      <line x1="1000" y1="78" x2="740" y2="130" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>

      <!-- ================= STAGE 1: INGEST ================= -->
      <rect x="530" y="132" width="380" height="60" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="720" y="157" text-anchor="middle" font-size="13" class="box-title">Ingest &amp; Normalize</text>
      <text x="720" y="174" text-anchor="middle" font-size="10.5" class="box-sub">provider mapping → canonical schema</text>

      <line x1="720" y1="192" x2="720" y2="248" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>
      <text x="734" y="223" font-size="10.5" class="arrow-label">normalized points</text>

      <!-- ================= STAGE 2: ROUTE + ANALYZE ================= -->
      <rect x="550" y="250" width="340" height="60" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="720" y="275" text-anchor="middle" font-size="13" class="box-title">Universal Router</text>
      <text x="720" y="292" text-anchor="middle" font-size="10.5" class="box-sub">feature extraction + series profiling</text>

      <line x1="720" y1="310" x2="720" y2="364" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>
      <text x="734" y="340" font-size="10.5" class="arrow-label">scored analyzer picks</text>

      <rect x="530" y="366" width="380" height="64" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="720" y="389" text-anchor="middle" font-size="13" class="box-title">Analyzer Registry</text>
      <text x="720" y="405" text-anchor="middle" font-size="10.5" class="box-sub">bounded, deterministic algorithms</text>
      <text x="720" y="418" text-anchor="middle" font-size="10.5" class="box-sub">anomaly · trend · shift · forecast</text>

      <!-- AI second opinion (optional, advisory) -->
      <g style="color:#6d5dfc">
        <line x1="890" y1="280" x2="978" y2="396" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow-purple)"></line>
        <rect x="902" y="327" width="62" height="14" fill="#ffffff"></rect>
        <text x="905" y="335" font-size="10" class="arrow-label">same input</text>

        <rect x="980" y="366" width="260" height="64" rx="10" fill="#f2f0ff" stroke="currentColor" stroke-width="1.6" stroke-dasharray="5 4"></rect>
        <text x="1110" y="393" text-anchor="middle" font-size="12.5" class="box-title">AI Second Opinion</text>
        <text x="1110" y="410" text-anchor="middle" font-size="10" class="box-sub">independent pick (optional)</text>

        <line x1="1108" y1="430" x2="912" y2="398" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow-purple)"></line>
        <text x="985" y="450" font-size="10" class="arrow-label">advisory — never overrides router</text>
      </g>

      <!-- ================= STAGE 3: FIND + CORRELATE ================= -->
      <line x1="655" y1="430" x2="530" y2="484" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>
      <text x="500" y="463" text-anchor="end" font-size="10.5" class="arrow-label">per-metric signal</text>

      <line x1="785" y1="430" x2="910" y2="484" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>
      <text x="925" y="463" font-size="10.5" class="arrow-label">cross-metric facts</text>

      <rect x="380" y="486" width="260" height="60" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="510" y="511" text-anchor="middle" font-size="13" class="box-title">Findings</text>
      <text x="510" y="528" text-anchor="middle" font-size="10.5" class="box-sub">single-metric</text>

      <rect x="760" y="486" width="380" height="60" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="950" y="511" text-anchor="middle" font-size="13" class="box-title">Behavior Intelligence Engine</text>
      <text x="950" y="528" text-anchor="middle" font-size="10.5" class="box-sub">cross-metric correlation rules</text>

      <!-- ================= STAGE 4: CASE LIFECYCLE ================= -->
      <line x1="530" y1="546" x2="680" y2="604" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>
      <line x1="930" y1="546" x2="762" y2="604" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>
      <rect x="617" y="577" width="206" height="15" fill="#ffffff"></rect>
      <text x="720" y="586" text-anchor="middle" font-size="10.5" class="arrow-label">promote to case (either source)</text>

      <rect x="490" y="606" width="460" height="64" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="720" y="631" text-anchor="middle" font-size="13" class="box-title">Case Lifecycle</text>
      <text x="720" y="648" text-anchor="middle" font-size="10.5" class="box-sub">investigation → RCA → resolution → recorded outcome</text>

      <!-- ================= STAGE 5: PERSIST ================= -->
      <line x1="650" y1="670" x2="490" y2="724" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>
      <line x1="790" y1="670" x2="950" y2="724" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>
      <text x="720" y="702" text-anchor="middle" font-size="10.5" class="arrow-label">persist</text>

      <rect x="280" y="726" width="360" height="86" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="460" y="752" text-anchor="middle" font-size="13.5" class="box-title">PostgreSQL</text>
      <text x="460" y="769" text-anchor="middle" font-size="10.5" class="box-sub">system of record</text>
      <text x="460" y="783" text-anchor="middle" font-size="10.5" class="box-sub">signals · findings · cases · learning outcomes</text>
      <text x="460" y="797" text-anchor="middle" font-size="10.5" class="box-sub">change events · alert enrichments</text>

      <rect x="800" y="726" width="360" height="86" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="980" y="752" text-anchor="middle" font-size="13.5" class="box-title">Qdrant</text>
      <text x="980" y="769" text-anchor="middle" font-size="10.5" class="box-sub">semantic index</text>
      <text x="980" y="783" text-anchor="middle" font-size="10.5" class="box-sub">case / finding / behavior embeddings</text>

      <line x1="640" y1="769" x2="798" y2="769" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"></line>
      <text x="719" y="763" text-anchor="middle" font-size="10" class="arrow-label">embed (deterministic text)</text>

      <!-- CI/CD change events -> PostgreSQL -->
      <g style="color:#b45309">
        <rect x="95" y="738" width="160" height="62" rx="10" fill="#fff4e5" stroke="currentColor" stroke-width="1.6"></rect>
        <text x="175" y="760" text-anchor="middle" font-size="12" class="box-title">CI/CD Change Events</text>
        <text x="175" y="775" text-anchor="middle" font-size="9.5" class="box-sub">deploys · config · flags</text>
        <text x="175" y="790" text-anchor="middle" font-size="9" class="mono">POST /api/events</text>
        <line x1="255" y1="769" x2="278" y2="769" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow-amber)"></line>
      </g>

      <!-- ================= BOUNDARY ================= -->
      <line x1="40" y1="850" x2="1380" y2="850" stroke="currentColor" stroke-width="1" stroke-dasharray="2 5" opacity="0.5"></line>
      <rect x="1180" y="838" width="200" height="24" rx="12" fill="#ffffff" stroke="currentColor" stroke-width="1" opacity="0.9"></rect>
      <text x="1280" y="854" text-anchor="middle" font-size="10" letter-spacing="0.03em" opacity="0.75">CONSUMERS</text>

      <!-- bus from stores to consumers -->
      <line x1="460" y1="812" x2="460" y2="822" stroke="currentColor" stroke-width="1.2"></line>
      <line x1="980" y1="812" x2="980" y2="822" stroke="currentColor" stroke-width="1.2"></line>
      <line x1="210" y1="822" x2="1160" y2="822" stroke="currentColor" stroke-width="1.2"></line>

      <line x1="210" y1="822" x2="210" y2="878" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>
      <line x1="525" y1="822" x2="525" y2="878" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>
      <line x1="825" y1="822" x2="825" y2="878" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>
      <line x1="1160" y1="822" x2="1160" y2="878" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>

      <!-- ================= STAGE 6: CONSUMERS ================= -->
      <g style="color:#b45309">
        <!-- alert enrichment also triggers analysis of the alerting series (not read-only) -->
        <path d="M 75 880 V 280 H 546" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow-amber)"></path>
        <text x="90" y="272" font-size="10" class="arrow-label">on demand: the alerting series, queried from Prometheus</text>

        <rect x="60" y="880" width="300" height="84" rx="10" fill="#fff4e5" stroke="currentColor" stroke-width="1.7"></rect>
        <text x="210" y="905" text-anchor="middle" font-size="13" class="box-title">Alert Enrichment</text>
        <text x="210" y="921" text-anchor="middle" font-size="10" class="box-sub">what happened · what changed · seen before</text>
        <text x="210" y="938" text-anchor="middle" font-size="9" class="mono">POST /api/integrations/alertmanager</text>
        <text x="210" y="952" text-anchor="middle" font-size="9" class="mono">POST /api/alerts</text>
        <rect x="140" y="863" width="140" height="16" fill="#ffffff"></rect>
        <text x="210" y="873" text-anchor="middle" font-size="10" class="arrow-label">history · similar cases</text>

        <!-- Alertmanager in, Slack out -->
        <rect x="60" y="1000" width="160" height="50" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
        <text x="140" y="1021" text-anchor="middle" font-size="12.5" class="box-title">Alertmanager</text>
        <text x="140" y="1037" text-anchor="middle" font-size="9.5" class="box-sub">firing / resolved alerts</text>
        <line x1="140" y1="1000" x2="140" y2="966" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow-amber)"></line>

        <rect x="250" y="1000" width="330" height="50" rx="10" fill="#fff4e5" stroke="currentColor" stroke-width="1.7"></rect>
        <text x="415" y="1021" text-anchor="middle" font-size="12.5" class="box-title">Slack</text>
        <text x="415" y="1037" text-anchor="middle" font-size="9.5" class="box-sub">one enriched message per alert · high-importance findings</text>
        <line x1="300" y1="964" x2="300" y2="998" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow-amber)"></line>
        <!-- finding notifications: posted when findings are saved -->
        <text x="368" y="512" text-anchor="end" font-size="10" class="arrow-label">also posted to Slack</text>
        <text x="368" y="525" text-anchor="end" font-size="10" class="arrow-label">when importance ≥ min</text>
      </g>

      <rect x="390" y="880" width="270" height="84" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="525" y="910" text-anchor="middle" font-size="13" class="box-title">Alert-Context API</text>
      <text x="525" y="927" text-anchor="middle" font-size="10.5" class="box-sub">for external alert managers</text>
      <text x="525" y="942" text-anchor="middle" font-size="10.5" class="box-sub">outcomes · similar cases · recurrence</text>
      <rect x="450" y="863" width="150" height="16" fill="#ffffff"></rect>
      <text x="525" y="873" text-anchor="middle" font-size="10" class="mono">GET /api/alert-context</text>

      <rect x="690" y="880" width="270" height="84" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="825" y="914" text-anchor="middle" font-size="13" class="box-title">Ask Ops Signals</text>
      <text x="825" y="931" text-anchor="middle" font-size="10.5" class="box-sub">chat assistant</text>
      <rect x="765" y="863" width="120" height="16" fill="#ffffff"></rect>
      <text x="825" y="873" text-anchor="middle" font-size="10" class="arrow-label">semantic + keyword</text>

      <rect x="990" y="880" width="340" height="84" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="1160" y="914" text-anchor="middle" font-size="13" class="box-title">Grafana Plugin &amp; Dashboards</text>
      <text x="1160" y="931" text-anchor="middle" font-size="10.5" class="box-sub">operator UI</text>
      <rect x="1082" y="863" width="156" height="16" fill="#ffffff"></rect>
      <text x="1160" y="873" text-anchor="middle" font-size="10" class="arrow-label">panels + recommendations</text>

  </g>

      <text x="720" y="1165" text-anchor="middle" font-size="9.5" letter-spacing="0.05em" fill="#7b8794">PLANNED — NOT YET IMPLEMENTED</text>

      <g style="color:#7b8794">
        <rect x="250" y="1175" width="340" height="48" rx="8" fill="#f5f6f7" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 4"></rect>
        <text x="420" y="1195" text-anchor="middle" font-size="11" class="box-title">Automation / ITSM</text>
        <text x="420" y="1210" text-anchor="middle" font-size="9" class="box-sub">Jira · ServiceNow — create/update tickets</text>

        <rect x="830" y="1175" width="340" height="48" rx="8" fill="#f5f6f7" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 4"></rect>
        <text x="1000" y="1195" text-anchor="middle" font-size="11" class="box-title">External Systems</text>
        <text x="1000" y="1210" text-anchor="middle" font-size="9" class="box-sub">generic webhooks · BI/reporting export</text>
      </g>

</svg>
