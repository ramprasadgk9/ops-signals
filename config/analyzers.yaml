analysis:
  mode: batch
  window: entire_dataset
  selection_mode: recommended_only
  selected_analyzers: []
  analyzers:
    ruptures:
      enabled: false
    stumpy:
      enabled: true
      window_size: 20
      motif_count: 1
      profile_threshold: 2.0
    prophet:
      enabled: true
      horizon_points: 10
      changepoint_prior_scale: 0.05
      uncertainty_threshold: 0.15
    baseline_shift:
      enabled: true
      ruptures:
        algorithm: binseg
        model: l2
        min_size: 5
        jump: 5
        n_bkps: 1
      statistical_gate:
        min_effect_size: 1.5
      operational_significance:
        min_change_percent: 25
    anomaly_zscore:
      enabled: true
      zscore_threshold: 3.0
      grouping_gap: 15m
    pyod_outlier:
      enabled: true
      detector_type: knn
      contamination: 0.05
      grouping_gap: 15m
      min_samples: 50
    trend:
      enabled: true
      min_slope_percent: 10
