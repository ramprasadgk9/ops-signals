analysis:
  mode: batch
  window: entire_dataset
  # Which analyzers a run uses: the router's best matches (recommendation_execution below).
  selection_mode: recommended_threshold
  # Which analyzers Analyzer Workbench -> Recommendations and the MCP recommendation tools list:
  # "all" scores every analyzer. Separate from selection_mode, which picks what actually runs.
  recommendation_selection_mode: all
  recommendation_execution:
    min_score: 0.80
    max_analyzers: 3
    include_optional: false
    cover_detected_profiles: true
  selected_analyzers: []
  analyzers:
    ruptures:
      enabled: true
    stumpy:
      enabled: true
      implementation:
        library: stumpy
        algorithm: stump
        mode: discord
        max_discords: 3
        window_size: 20
        motif_count: 1
        profile_threshold: 2.0
      finding_rules:
        min_surprise: 8.0
        max_motif_distance: 1.0
        min_confidence: 0.75
    prophet:
      enabled: true
      implementation:
        library: prophet
        horizon_points: 10
        changepoint_prior_scale: 0.05
        uncertainty_threshold: 0.15
      finding_rules:
        min_relative_error: 0.25
    baseline_shift:
      enabled: true
      ruptures:
        algorithm: binseg
        model: l2
        min_size: 5
        jump: 5
        n_bkps: 1
      finding_rules:
        min_change_percent: 25
        min_effect_size: 1.5
    anomaly_zscore:
      enabled: true
      implementation:
        library: pandas
        method: zscore
        zscore_threshold: 3.0
        grouping_gap: 15m
      finding_rules:
        min_abs_zscore: 3.0
        min_points: 1
    pyod_outlier:
      enabled: true
      implementation:
        library: pyod
        detector: KNN
        detector_type: knn
        contamination: 0.01
        grouping_gap: 15m
        min_samples: 50
      finding_rule:
        # A group of outliers is a finding on either kind of evidence (see PyODOutlierAnalyzer):
        # a clear spike - its value at least this many normal ranges (5th-95th percentile) beyond
        # the normal range; 0.56 is the standard 3.5-standard-deviation outlier cut-off in these
        # units, so healthy noise stays quiet - or a sustained unusual stretch of at least
        # min_sustained_points outlier points close together, even inside the normal range.
        min_range_excess: 0.56
        min_sustained_points: 8
        window: 15m
        # Quiet mode: a spike must also stand out from the metric's usual daily peaks (see
        # PyODOutlierAnalyzer). Far fewer alerts, but it misses incidents about the size of a normal
        # busy peak: on full NAB false alarms 1,091 -> 251 but incidents caught 79 -> 65, and on
        # SMD caught 40 -> 29 of 52, fewer than the old rule at the same alert volume. Off by default.
        compare_daily_peaks: false
    trend:
      enabled: true
      implementation:
        library: statsmodels
        # A straight-line least-squares fit; the only model the trend analyzer has.
        model: OLS
      finding_rules:
        min_slope_percent: 10
