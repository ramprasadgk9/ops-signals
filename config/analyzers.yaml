analysis:
  mode: batch
  window: entire_dataset
  analyzers:
    ruptures:
      enabled: true
    stumpy:
      enabled: false
    prophet:
      enabled: false
    baseline_shift:
      enabled: true
      threshold_percent: 25
    anomaly_zscore:
      enabled: true
      zscore_threshold: 3.0
      grouping_gap: 15m
    trend:
      enabled: true
      min_slope_percent: 10
