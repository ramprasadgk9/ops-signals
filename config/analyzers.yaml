analysis:
  mode: batch
  window: entire_dataset
  selection_mode: recommended_only
  selected_analyzers: []
  analyzers:
    ruptures:
      enabled: true
    stumpy:
      enabled: true
      window_size: 20
      motif_count: 1
      profile_threshold: 2.0
    prophet:
      enabled: true
      horizon_points: 10
      changepoint_prior_scale: 0.05
      uncertainty_threshold: 0.15
    baseline_shift:
      enabled: true
      threshold_percent: 25
    anomaly_zscore:
      enabled: true
      zscore_threshold: 3.0
      grouping_gap: 15m
    trend:
      enabled: true
      min_slope_percent: 10
