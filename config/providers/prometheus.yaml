input:
  source_type: csv
  provider: prometheus
  schema_version: v1
  file_path: sample_data/prometheus_cpu_usage_sample.csv
  history: 1d
  interval: 5m
  service: checkout
  metric_name: node_cpu_usage_seconds_total
  timestamp_column: timestamp
  value_column: value
  metric_column: metric_name
  provider_mappings:
    metric_name: metric
    host: instance
  validation:
    enforce_monotonic_timestamp: true
    allow_negative_values: false
    max_gap_minutes: 30
    max_null_ratio: 0.1
  required_columns:
    - timestamp
    - metric
    - value
  optional_columns:
    - service
    - env
    - host
    - namespace
    - pod
    - source
    - unit
    - metric_type
