input:
  source_type: otel
  provider: otel
  schema_version: v1
  file_path: ""
  history: 1d
  interval: 1m
  service: otel-service
  metric_name: otel_metric
  timestamp_column: timestamp
  value_column: value
  metric_column: metric_name
  validation:
    enforce_monotonic_timestamp: false
    allow_negative_values: true
    max_gap_minutes: 60
    # warn: keep a series with an oversized gap and record a warning; reject: refuse it
    gap_policy: warn
    max_null_ratio: 0.2
  required_columns:
    - metric_name
    - timestamp
    - value
  optional_columns:
    - service
    - env
    - host
    - namespace
    - pod
    - source
    - unit
    - metric_type
