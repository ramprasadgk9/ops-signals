input:
  source_type: csv
  provider: custom
  schema_version: v1
  file_path: sample_data/cpu_usage_sample.csv
  history: 7d
  interval: 5m
  service: checkout-service
  metric_name: cpu_usage
  timestamp_column: timestamp
  value_column: value
  metric_column: metric_name
  # provider_mappings/required_columns here are just a fallback - build_csv_routing_config()
  # always replaces both with the column names a user types in at upload time for the
  # "Custom / Other" provider (ad-hoc, one-time, not persisted anywhere).
  provider_mappings: {}
  validation:
    enforce_monotonic_timestamp: true
    allow_negative_values: false
    max_gap_minutes: 60
    max_null_ratio: 0.1
  required_columns:
    - timestamp
    - metric_name
    - value
  optional_columns:
    - service
    - env
    - host
    - namespace
    - pod
    - source
    - unit
    - metric_type
