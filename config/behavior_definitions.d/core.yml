behavior_definitions:
  cpu_throttling:
    enabled: true
    version: 1
    title: Possible CPU throttling
    description: >
      Detects abnormal CPU usage occurring together with increased
      CPU throttling activity.
    scope:
      service: "*"
    inputs:
      - alias: cpu
        metric_name: cpu_usage
        analyzers:
          - anomaly_zscore
          - pyod_outlier
          - trend
      - alias: throttling
        metric_name: cpu_throttled_seconds
        analyzers:
          - anomaly_zscore
          - pyod_outlier
          - trend
    conditions:
      all:
        - fact: cpu.anomaly.present
          operator: equals
          value: true
        - fact: throttling.trend.direction
          operator: equals
          value: upward
      any:
        - fact: throttling.anomaly.present
          operator: equals
          value: true
        - fact: throttling.trend.change_percent
          operator: greater_than
          value: 20
    correlation:
      same_analysis_context: true
      max_time_gap: 15m
      minimum_overlap: 5m
    output:
      category: resource_constraint
      severity: high
      title: Possible CPU throttling detected
      summary: >
        CPU usage showed abnormal behavior while throttling activity
        increased during the same analysis period.
      evidence:
        - cpu.anomaly.count
        - cpu.anomaly.max_score
        - cpu.trend.direction
        - throttling.anomaly.count
        - throttling.trend.change_percent

  server_slow:
    enabled: true
    version: 1
    title: Possible server performance degradation
    description: >
      Detects related CPU and memory degradation that may contribute
      to server slowness.
    scope:
      service: "*"
    inputs:
      - alias: cpu
        metric_name: cpu_usage
        analyzers:
          - anomaly_zscore
          - pyod_outlier
          - baseline_shift
      - alias: memory
        metric_name: memory_usage
        analyzers:
          - anomaly_zscore
          - pyod_outlier
          - trend
          - baseline_shift
    conditions:
      all:
        - fact: cpu.anomaly.present
          operator: equals
          value: true
      any:
        - fact: memory.trend.direction
          operator: equals
          value: upward
        - fact: memory.baseline_shift.present
          operator: equals
          value: true
    correlation:
      same_analysis_context: true
      max_time_gap: 20m
      minimum_overlap: 5m
    output:
      category: performance
      severity: medium
      title: Possible server performance degradation
      summary: >
        CPU and memory behavior indicate a degradation pattern that may
        be contributing to server slowness.
      evidence:
        - cpu.anomaly.count
        - cpu.anomaly.max_score
        - memory.trend.direction
        - memory.baseline_shift.present

  memory_leak:
    enabled: true
    version: 1
    title: Memory leak causing degradation
    description: >
      Detects sustained upward memory trend occurring alongside CPU
      throttling or performance degradation.
    scope:
      service: "*"
    inputs:
      - alias: memory
        metric_name: memory_usage
        analyzers:
          - trend
          - baseline_shift
      - alias: throttling
        metric_name: cpu_throttled_seconds
        analyzers:
          - trend
          - baseline_shift
    conditions:
      all:
        - fact: memory.trend.direction
          operator: equals
          value: upward
      any:
        - fact: throttling.trend.direction
          operator: equals
          value: upward
        - fact: throttling.baseline_shift.present
          operator: equals
          value: true
    correlation:
      same_analysis_context: true
      max_time_gap: 30m
      minimum_overlap: 5m
    output:
      category: resource_constraint
      severity: critical
      title: Memory leak driving resource degradation
      summary: >
        Sustained upward memory trend was accompanied by increased CPU throttling,
        indicating a memory leak driving resource exhaustion.
      evidence:
        - memory.trend.direction
        - memory.trend.change_percent
        - throttling.baseline_shift.present

  pool_exhaustion:
    enabled: true
    version: 1
    title: Database connection pool exhaustion
    description: >
      Detects high database connection utilization and connection wait times
      causing downstream request queues or timeouts.
    scope:
      service: "*"
    inputs:
      - alias: db_wait
        metric_name: db_connection_wait_seconds
        analyzers:
          - trend
      - alias: db_pool
        metric_name: db_connections_active
        analyzers:
          - trend
    conditions:
      all:
        - fact: db_wait.trend.direction
          operator: equals
          value: upward
      any:
        - fact: db_pool.trend.direction
          operator: equals
          value: upward
    correlation:
      same_analysis_context: true
      max_time_gap: 30m
      minimum_overlap: 5m
    output:
      category: resource_constraint
      severity: critical
      title: Database connection pool exhaustion
      summary: >
        Database connection pool reached saturation with surging connection wait times.
      evidence:
        - db_wait.trend.direction
        - db_pool.trend.direction

  benign_maintenance:
    enabled: true
    version: 1
    title: Scheduled maintenance or batch processing
    description: >
      Detects batch job activity causing temporary CPU or resource rise.
    scope:
      service: "*"
    inputs:
      - alias: batch
        metric_name: batch_jobs_active
        analyzers:
          - trend
      - alias: cpu
        metric_name: cpu_usage
        analyzers:
          - trend
    conditions:
      all:
        - fact: batch.trend.present
          operator: equals
          value: true
      any:
        - fact: cpu.trend.present
          operator: equals
          value: true
    correlation:
      same_analysis_context: true
      max_time_gap: 30m
      minimum_overlap: 5m
    output:
      category: maintenance
      severity: low
      title: Scheduled batch maintenance activity
      summary: >
        Active batch jobs correlated with temporary CPU load, consistent with scheduled maintenance.
      evidence:
        - batch.trend.present
        - cpu.trend.present
