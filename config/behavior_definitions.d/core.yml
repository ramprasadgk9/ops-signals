behavior_definitions:
  cpu_throttling:
    enabled: true
    version: 2
    title: Possible CPU throttling
    description: >
      Detects abnormal CPU usage occurring together with increased
      CPU throttling activity.
    scope:
      service: "*"
    inputs:
      - alias: cpu
        metric_name: cpu_usage
        # OpenTelemetry names for the same metric (Kubernetes kubelet and Docker receivers), as sent over OTLP
        aliases: [container.cpu.usage, container.cpu.utilization, k8s.pod.cpu.usage]
        analyzers:
          - anomaly_zscore
          - pyod_outlier
          - trend
      - alias: throttling
        metric_name: cpu_throttled_seconds
        analyzers:
          - anomaly_zscore
          - pyod_outlier
          - trend
          - baseline_shift
          - ruptures
    conditions:
      all:
        - fact: cpu.anomaly.present
          operator: equals
          value: true
        # "Went up", whichever of trend, baseline_shift or ruptures the router ran.
        - fact: throttling.change.upward
          operator: equals
          value: true
      any:
        - fact: throttling.anomaly.present
          operator: equals
          value: true
        - fact: throttling.change.change_percent
          operator: greater_than
          value: 20
    correlation:
      same_analysis_context: true
      max_time_gap: 15m
      minimum_overlap: 5m
    output:
      category: resource_constraint
      severity: high
      title: Possible CPU throttling detected
      summary: >
        CPU usage showed abnormal behavior while throttling activity
        increased during the same analysis period.
      evidence:
        - cpu.anomaly.count
        - cpu.anomaly.max_score
        - cpu.trend.direction
        - throttling.anomaly.count
        - throttling.change.signed_change_percent

  server_slow:
    enabled: true
    version: 2
    title: Possible server performance degradation
    description: >
      Detects related CPU and memory degradation that may contribute
      to server slowness.
    scope:
      service: "*"
    inputs:
      - alias: cpu
        metric_name: cpu_usage
        # OpenTelemetry names for the same metric (Kubernetes kubelet and Docker receivers), as sent over OTLP
        aliases: [container.cpu.usage, container.cpu.utilization, k8s.pod.cpu.usage]
        analyzers:
          - anomaly_zscore
          - pyod_outlier
          - baseline_shift
      - alias: memory
        metric_name: memory_usage
        # OpenTelemetry names for the same metric (Kubernetes kubelet and Docker receivers), as sent over OTLP
        aliases: [container.memory.usage, container.memory.usage.total, k8s.pod.memory.usage]
        analyzers:
          - anomaly_zscore
          - pyod_outlier
          - trend
          - baseline_shift
          - ruptures
    conditions:
      all:
        - fact: cpu.anomaly.present
          operator: equals
          value: true
      any:
        # Upward only - memory freed is not degradation. change.upward is a trend up, a baseline
        # shift up, or a ruptures change of more than +25% (ruptures runs in default router mode on
        # a level change; baseline_shift does not).
        - fact: memory.change.upward
          operator: equals
          value: true
    correlation:
      same_analysis_context: true
      max_time_gap: 20m
      minimum_overlap: 5m
    output:
      category: performance
      severity: medium
      title: Possible server performance degradation
      summary: >
        CPU and memory behavior indicate a degradation pattern that may
        be contributing to server slowness.
      evidence:
        - cpu.anomaly.count
        - cpu.anomaly.max_score
        - memory.change.direction
        - memory.change.signed_change_percent

  memory_leak:
    enabled: true
    version: 2
    title: Memory leak causing degradation
    description: >
      Detects sustained upward memory trend occurring alongside CPU
      throttling or performance degradation.
    scope:
      service: "*"
    inputs:
      - alias: memory
        metric_name: memory_usage
        # OpenTelemetry names for the same metric (Kubernetes kubelet and Docker receivers), as sent over OTLP
        aliases: [container.memory.usage, container.memory.usage.total, k8s.pod.memory.usage]
        analyzers:
          - trend
          - baseline_shift
          - ruptures
      - alias: throttling
        metric_name: cpu_throttled_seconds
        analyzers:
          - trend
          - baseline_shift
          - ruptures
    conditions:
      all:
        # A steady climb often reaches the router as a ruptures level change, not a trend.
        - fact: memory.change.upward
          operator: equals
          value: true
      any:
        # Upward only, as in server_slow.
        - fact: throttling.change.upward
          operator: equals
          value: true
    correlation:
      same_analysis_context: true
      max_time_gap: 30m
      minimum_overlap: 5m
    output:
      category: resource_constraint
      severity: critical
      title: Memory leak driving resource degradation
      summary: >
        Sustained upward memory trend was accompanied by increased CPU throttling,
        indicating a memory leak driving resource exhaustion.
      evidence:
        - memory.change.direction
        - memory.change.signed_change_percent
        - throttling.change.signed_change_percent

  pool_exhaustion:
    enabled: true
    version: 2
    title: Database connection pool exhaustion
    description: >
      Detects high database connection utilization and connection wait times
      causing downstream request queues or timeouts.
    scope:
      service: "*"
    inputs:
      - alias: db_wait
        metric_name: db_connection_wait_seconds
        analyzers:
          - trend
          - baseline_shift
          - ruptures
      - alias: db_pool
        metric_name: db_connections_active
        analyzers:
          - trend
          - baseline_shift
          - ruptures
    conditions:
      all:
        - fact: db_wait.change.upward
          operator: equals
          value: true
      any:
        - fact: db_pool.change.upward
          operator: equals
          value: true
    correlation:
      same_analysis_context: true
      max_time_gap: 30m
      minimum_overlap: 5m
    output:
      category: resource_constraint
      severity: critical
      title: Database connection pool exhaustion
      summary: >
        Database connection pool reached saturation with surging connection wait times.
      evidence:
        - db_wait.change.signed_change_percent
        - db_pool.change.signed_change_percent

  benign_maintenance:
    enabled: true
    version: 2
    title: Scheduled maintenance or batch processing
    description: >
      Detects batch job activity causing temporary CPU or resource rise.
    scope:
      service: "*"
    inputs:
      - alias: batch
        metric_name: batch_jobs_active
        analyzers:
          - trend
          - baseline_shift
          - ruptures
      - alias: cpu
        metric_name: cpu_usage
        # OpenTelemetry names for the same metric (Kubernetes kubelet and Docker receivers), as sent over OTLP
        aliases: [container.cpu.usage, container.cpu.utilization, k8s.pod.cpu.usage]
        analyzers:
          - trend
          - baseline_shift
          - ruptures
    conditions:
      all:
        - fact: batch.change.upward
          operator: equals
          value: true
      any:
        - fact: cpu.change.upward
          operator: equals
          value: true
    correlation:
      same_analysis_context: true
      max_time_gap: 30m
      minimum_overlap: 5m
    output:
      category: maintenance
      severity: low
      title: Scheduled batch maintenance activity
      summary: >
        Active batch jobs correlated with temporary CPU load, consistent with scheduled maintenance.
      evidence:
        - batch.change.signed_change_percent
        - cpu.change.signed_change_percent
