# Second example pack file — a memory-pressure-causing-errors pattern, separate from
# latency_and_errors.yml to show packs can be organized by theme/team/source however makes sense.
behavior_definitions:
  memory_pressure_with_errors:
    enabled: true
    version: 1
    title: Possible memory pressure impacting requests
    description: >
      Detects sustained upward memory pressure (trend or baseline shift) occurring together
      with an error-rate anomaly, suggestive of memory exhaustion starting to affect requests.
    scope:
      service: "*"
    inputs:
      - alias: memory
        metric_name: memory_usage
        # OpenTelemetry names for the same metric, as sent over OTLP
        aliases: [container.memory.usage, k8s.pod.memory.usage]
        analyzers:
          - trend
          - baseline_shift
          - ruptures
      - alias: errors
        metric_name: error_rate
        analyzers:
          - anomaly_zscore
          - pyod_outlier
    conditions:
      all:
        - fact: errors.anomaly.present
          operator: equals
          value: true
      any:
        - fact: memory.trend.direction
          operator: equals
          value: upward
        # Upward level changes only, as in server_slow (core.yml).
        - fact: memory.baseline_shift.signed_change_percent
          operator: greater_than
          value: 0
        - fact: memory.ruptures.signed_change_percent
          operator: greater_than
          value: 25
    correlation:
      same_analysis_context: true
      max_time_gap: 20m
      minimum_overlap: 5m
    output:
      category: resource_constraint
      severity: high
      title: Possible memory pressure impacting requests
      summary: >
        Memory usage is trending upward or shifted to a new baseline while errors are also
        anomalous in the same window — worth checking for memory exhaustion.
      evidence:
        - memory.trend.direction
        - memory.trend.change_percent
        - memory.baseline_shift.signed_change_percent
        - memory.ruptures.signed_change_percent
        - errors.anomaly.count
