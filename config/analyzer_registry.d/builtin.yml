# Config-driven registrations for the 7 built-in analyzers, migrated from the old hardcoded
# SignalPipeline._build_analyzers() if/elif chain in intelligence/pipeline.py.
# runtime_params below are the exact effective values config/analyzers.yaml + pipeline.py's old helper functions
# (_baseline_shift_params, _analyzer_finding_rules, _analyzer_implementation) produced before
# this migration - verified byte-identical via the full pytest suite and
# tests/test_router_benchmark.py.
#
# config/analyzers.yaml's `analysis.analyzers.<id>.enabled`/`.params` still take precedence as an
# override source (see SignalPipeline._override_params_for) - that's what keeps config-file
# toggling and Analyzer Labs' "run with custom params" execution-test flow working unchanged.
#
# The `router` block is intentionally omitted for now - nothing reads it from this file yet. See
# Phase 1 Step 3 of the analyzer extensibility plan, which unifies this with
# experiments/analyzer_router/analyzer_registry.yaml.
analyzers:
  baseline_shift:
    display_name: Baseline Shift
    description: "Checks whether the metric's normal level changed and stayed changed. Example: latency settles at 425 ms instead of 620 ms."
    enabled: true
    class_path: intelligence.analyzers.baseline_shift.BaselineShiftAnalyzer
    runtime_params:
      threshold_percent: 25.0
      min_segment_size: 5
      change_threshold: 1.5
      ruptures_algorithm: binseg
      ruptures_model: l2
      ruptures_jump: 5
      ruptures_n_bkps: 1
    # What a per-service override (config/analyzer_overrides.d/) may change, by its path in
    # config/analyzers.yaml. Anything not listed here can't be overridden per service.
    tunable:
      finding_rules.min_change_percent:
        type: number
        min: 5
        max: 200
        label: Smallest lasting change in level that counts, in %
      finding_rules.min_effect_size:
        type: number
        min: 0.5
        max: 5
        label: How clearly the new level must stand apart from the old, in standard deviations

  ruptures:
    display_name: Ruptures
    description: "Finds the moment a metric jumps to a new normal level and stays there. Example: CPU jumps after a deploy."
    enabled: true
    class_path: intelligence.analyzers.ruptures.RupturesAnalyzer
    runtime_params:
      min_segment_size: 5
      change_threshold: 1.5

  anomaly_zscore:
    display_name: Z-Score Anomaly
    description: "Flags readings far from the series' average. Used for spikes on short series. Example: CPU reaches 96%."
    enabled: true
    class_path: intelligence.analyzers.anomaly_zscore.ZScoreAnomalyAnalyzer
    runtime_params:
      zscore_threshold: 3.0
      grouping_gap: 15m
      implementation:
        library: pandas
        method: zscore
        zscore_threshold: 3.0
        grouping_gap: 15m
      finding_rules:
        min_abs_zscore: 3.0
        min_points: 1
      rebaseline:
        enabled: true
        min_segment_size: 5
        change_threshold: 1.5
        max_iterations: 5
    tunable:
      # Readings are only flagged from 3 standard deviations (implementation.zscore_threshold),
      # so a finding can be made stricter than that, not looser.
      finding_rules.min_abs_zscore:
        type: number
        min: 3
        max: 10
        label: How far from the average a reading must be to count, in standard deviations

  pyod_outlier:
    display_name: PyOD Outlier
    description: "Flags short, sharp spikes that don't fit the usual range. Example: one reading of 85 among readings around 40."
    enabled: true
    class_path: intelligence.analyzers.pyod_outlier.PyODOutlierAnalyzer
    runtime_params:
      detector_type: knn
      contamination: 0.01
      grouping_gap: 15m
      min_samples: 50
      implementation:
        library: pyod
        detector: KNN
        detector_type: knn
        contamination: 0.01
        grouping_gap: 15m
        min_samples: 50
      finding_rule:
        # A group of outliers is a finding on either kind of evidence (see PyODOutlierAnalyzer):
        # a clear spike - its value at least this many normal ranges (5th-95th percentile) beyond
        # the normal range; 0.56 is the standard 3.5-standard-deviation outlier cut-off in these
        # units, so healthy noise stays quiet - or a sustained unusual stretch of at least
        # min_sustained_points outlier points close together, even inside the normal range.
        min_range_excess: 0.56
        min_sustained_points: 8
        window: 15m
        # Quiet mode, off by default; see config/analyzers.yaml.
        compare_daily_peaks: false
    tunable:
      finding_rule.min_range_excess:
        type: number
        min: 0.2
        max: 5
        label: How far beyond the normal range a spike must reach, in widths of that range
      finding_rule.min_sustained_points:
        type: integer
        min: 2
        max: 100
        label: How many unusual readings close together count as an unusual stretch

  trend:
    display_name: Trend Analysis
    description: "Spots slow, steady climbs or drops. Example: memory grows every hour."
    enabled: true
    class_path: intelligence.analyzers.trend.TrendAnalyzer
    runtime_params:
      implementation:
        library: statsmodels
        model: OLS
      finding_rules:
        min_slope_percent: 10
    tunable:
      finding_rules.min_slope_percent:
        type: number
        min: 1
        max: 100
        label: Smallest steady climb or drop that counts, as % of the metric's usual level

  stumpy:
    display_name: STUMPY
    description: "Finds a stretch that looks unlike the rest of the series. Example: one day's CPU surge that doesn't end."
    enabled: true
    class_path: intelligence.analyzers.stumpy.STUMPYAnalyzer
    # Runs on every series, outside the router's slots: in discord mode it stays quiet unless a
    # stretch stands out (min_surprise), and the router only scored it for seasonal series.
    always_run: true
    runtime_params:
      window_size: 20
      motif_count: 1
      profile_threshold: 2.0
      implementation:
        library: stumpy
        algorithm: stump
        # Report the series' most unusual stretches (matrix-profile discords), not its most
        # repeated one: "found a repeated pattern" fired on almost any series. Analyzer Labs'
        # motif page still runs motif mode.
        mode: discord
        max_discords: 3
        window_size: 20
        motif_count: 1
        profile_threshold: 2.0
      finding_rules:
        min_surprise: 8.0
        max_motif_distance: 1.0
        min_confidence: 0.75

  prophet:
    display_name: Prophet
    description: "Forecasts the expected value from trend and daily cycles, and flags big misses. Example: Sunday traffic double the forecast."
    enabled: true
    class_path: intelligence.analyzers.prophet.ProphetAnalyzer
    # Optional dependency. Without it ProphetAnalyzer falls back to a straight-line fit, so the
    # router's Prophet score doesn't describe what runs and it doesn't get a router slot.
    requires_library: prophet
    runtime_params:
      horizon_points: 10
      changepoint_prior_scale: 0.05
      uncertainty_threshold: 0.15
      implementation:
        library: prophet
        horizon_points: 10
        changepoint_prior_scale: 0.05
        uncertainty_threshold: 0.15
      finding_rules:
        min_relative_error: 0.25
