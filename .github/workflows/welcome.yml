name: Welcome

# Thanks someone on their first issue or first pull request here, and points them to the contributor
# guide. Runs only when an issue or pull request is opened, takes a few seconds, and never checks out
# or runs the pull request's code (pull_request_target is used so it can comment on pull requests
# from forks).

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    name: Welcome first-time contributors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.sender.type != 'Bot'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const isPullRequest = Boolean(context.payload.pull_request);
            const item = context.payload.pull_request || context.payload.issue;
            if (['OWNER', 'MEMBER', 'COLLABORATOR'].includes(item.author_association)) {
              return;
            }

            // Issues and pull requests share one list; keep the kind that was just opened.
            const { owner, repo } = context.repo;
            const opened = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, creator: item.user.login, state: 'all', per_page: 100,
            });
            const sameKind = opened.filter((entry) => Boolean(entry.pull_request) === isPullRequest);
            if (sameKind.length > 1) {
              return;
            }

            const guide = `https://github.com/${owner}/${repo}/blob/main/CONTRIBUTING.md`;
            const discussions = `https://github.com/${owner}/${repo}/discussions`;
            const body = isPullRequest
              ? [
                  `Thanks for your first pull request to Ops Signals, @${item.user.login}!`,
                  '',
                  `A maintainer will review it. While you wait, check that every commit is signed off ` +
                  `(\`git commit -s\`) - see [Sign Off Your Commits](${guide}#sign-off-your-commits).`,
                ].join('\n')
              : [
                  `Thanks for opening your first issue, @${item.user.login}!`,
                  '',
                  `A maintainer will take a look. If you'd like to work on it yourself, say so here and ` +
                  `read the [contributor guide](${guide}). Questions about setup or usage fit best in ` +
                  `[Discussions](${discussions}).`,
                ].join('\n');

            await github.rest.issues.createComment({ owner, repo, issue_number: item.number, body });
