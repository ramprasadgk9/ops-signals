name: CI

# Runs only when started by hand: Actions -> CI -> Run workflow (or `gh workflow run ci.yml`).
on:
  workflow_dispatch:

# A newer run on the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Docs-only changes still run: tests/test_assistant_golden.py checks the docs themselves (a doc
# edit that moves or removes an answer the golden questions expect fails it).

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # tests/test_helm_chart.py renders the Helm chart and skips without helm.
      - uses: azure/setup-helm@v4

      # The MiniLM embedding model (~90 MB) used by test_memory_recall.py and test_assistant_golden.py.
      # The model is pinned by name, so the key never needs to change.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      # tests/scenarios/backend, tests/api_backend, and the analyzer/router unit tests all run
      # against in-memory SQLite (see tests/api_backend/conftest.py) — no docker/Postgres needed.
      - name: Run pytest
        run: pytest -q

  # The tests run on 3.12, the version the Docker images use. 3.11 and 3.14 are supported too
  # (README, scripts/setup.sh): this catches code either one can't even parse, in about a minute.
  python-versions:
    name: Python ${{ matrix.python }} (compiles)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Compile every project Python file
        run: python -m compileall -q -x '/\.cache/|node_modules' backend intelligence benchmark experiments scripts examples dev tests

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npm test

      - name: Build standalone web-ui
        run: npm run build

      - name: Build Grafana plugin
        run: npm run build:grafana

