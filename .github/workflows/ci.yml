name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # tests/scenarios/backend, tests/api_backend, and the analyzer/router unit tests all run
      # against in-memory SQLite (see tests/api_backend/conftest.py) — no docker/Postgres needed.
      - name: Run pytest suite
        run: |
          pytest -q

  frontend:
    name: Frontend Typecheck, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci

      - name: Run Vitest unit tests
        run: |
          npm test

      - name: Build standalone web-ui
        run: |
          npm run build

      - name: Build Grafana plugin
        run: |
          npm run build:grafana

  docker-smoke:
    name: Docker Build Smoke Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          tags: ops-signals-backend:ci

      - name: Build MCP Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/mcp.Dockerfile
          push: false
          tags: ops-signals-mcp:ci

      - name: Build web Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          tags: ops-signals-web:ci
