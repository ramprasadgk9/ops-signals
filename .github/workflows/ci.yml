name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Docs-only changes still run: tests/test_assistant_golden.py checks the docs themselves (a doc
# edit that moves or removes an answer the golden questions expect fails it).

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The MiniLM embedding model (~90 MB) used by test_memory_recall.py and test_assistant_golden.py.
      # The model is pinned by name, so the key never needs to change.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      # tests/scenarios/backend, tests/api_backend, and the analyzer/router unit tests all run
      # against in-memory SQLite (see tests/api_backend/conftest.py) — no docker/Postgres needed.
      - name: Run pytest
        run: pytest -q

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npm test

      - name: Build standalone web-ui
        run: npm run build

      - name: Build Grafana plugin
        run: npm run build:grafana
