name: Integration

# Runs the real-stack Playwright suite (tests/scenarios/integration) against a live
# Postgres/Prometheus/Grafana/backend stack via scripts/test_local_integration_scenarios.sh.
# Kept separate from the fast pytest/vitest CI workflow since it needs Docker services and takes
# several minutes. Runs weekly and on demand, not on every push to main (about 340 Actions minutes
# a month when it did). Before a release, or after a change to the real stack, run it by hand:
#   gh workflow run integration.yml --ref main
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  integration:
    name: Real-stack integration suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # ubuntu-latest ships with ~40GB of preinstalled toolchains this workflow never touches
      # (.NET, Android SDK, GHC, CodeQL) eating into the runner's disk before anything here even
      # runs. Combined with pip's torch/sentence-transformers, npm, Playwright's Chromium, and 5
      # Docker Compose images, that was enough to exhaust the runner's disk mid-run - both prior
      # Integration runs failed with "no space left on device" while pulling Docker image layers,
      # not from any actual test failure. This reclaims the unused toolchains up front.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h /

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Caches only the downloaded browser binary (the slow, multi-hundred-MB part). `--with-deps`
      # still runs on every run to make sure the OS-level libraries Chromium needs are present -
      # that step is fast and isn't worth the complexity of caching apt state.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run integration suite
        run: ./scripts/test_local_integration_scenarios.sh

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            frontend/test-results/
          retention-days: 7
