name: Integration

# Runs the real-stack Playwright suite (tests/scenarios/integration) against a live
# Postgres/Prometheus/Grafana/backend stack via scripts/test_local_integration_scenarios.sh.
# Kept separate from the fast pytest/vitest CI workflow since it needs Docker services and takes
# several minutes — runs on push to main and on demand, not on every PR.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  integration:
    name: Real-stack integration suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run integration suite
        run: ./scripts/test_local_integration_scenarios.sh

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/test-results/
          retention-days: 7
