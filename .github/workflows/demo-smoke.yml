name: Demo smoke test

# Brings up the five-minute demo (docker-compose.demo.yml) exactly as a new user would and checks
# the enriched alert tells the whole story: shift found, deploy correlated, past case matched.
# Guards the README promise against analyzer, enrichment, image, or compose changes.

# Push to main uses the same path filter as PRs (keep the two lists identical): a docs-only merge
# can't change what the demo does.
on:
  pull_request:
    paths:
      - "backend/**"
      - "intelligence/**"
      - "config/**"
      - "config.yaml"
      - "demo/**"
      - "docker/**"
      - "frontend/**"
      - "sql/**"
      - "requirements.txt"
      - "docker-compose.demo.yml"
      - "scripts/demo_smoke_test.py"
      - ".github/workflows/demo-smoke.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "intelligence/**"
      - "config/**"
      - "config.yaml"
      - "demo/**"
      - "docker/**"
      - "frontend/**"
      - "sql/**"
      - "requirements.txt"
      - "docker-compose.demo.yml"
      - "scripts/demo_smoke_test.py"
      - ".github/workflows/demo-smoke.yml"
  workflow_dispatch:

concurrency:
  group: demo-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    name: docker compose demo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The backend image is ~3 GB; the default runner's free disk is tight for build + cache.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v4

      # Built here (not pulled) so the test covers this commit's code, tagged with the names
      # docker-compose.demo.yml uses so Compose finds them locally and skips the pull.
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/backend.Dockerfile
          load: true
          tags: ghcr.io/ramprasadgk9/ops-signals-backend:latest
          cache-from: type=gha,scope=ops-signals-backend
          cache-to: type=gha,mode=max,scope=ops-signals-backend

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web.Dockerfile
          load: true
          tags: ghcr.io/ramprasadgk9/ops-signals-web:latest
          cache-from: type=gha,scope=ops-signals-web
          cache-to: type=gha,mode=max,scope=ops-signals-web

      - name: Start the demo
        run: docker compose -f docker-compose.demo.yml up -d

      - name: Smoke test
        run: python3 scripts/demo_smoke_test.py --timeout 600

      - name: Service logs
        if: failure()
        run: |
          docker compose -f docker-compose.demo.yml ps -a
          docker compose -f docker-compose.demo.yml logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.demo.yml down -v
