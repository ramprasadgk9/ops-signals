server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://ops-signals-backend:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The web UI's API token is added here, server-side, so it never reaches the browser. The nginx
    # image fills OPS_SIGNALS_API_TOKEN in at startup; empty is fine while the backend has no token.
    proxy_set_header Authorization "Bearer ${OPS_SIGNALS_API_TOKEN}";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
