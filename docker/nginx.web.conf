# The web UI's API token, added below to every /api/ request. With the backend's own sign-in
# (OPS_SIGNALS_AUTH_MODE=oidc) it is not: people sign in, the session cookie says who they are, and a
# browser must not borrow the token's rights. The nginx image fills both values in at startup.
map "${OPS_SIGNALS_AUTH_MODE}" $ops_signals_authorization {
  oidc "";
  default "Bearer ${OPS_SIGNALS_API_TOKEN}";
}

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass ${OPS_SIGNALS_BACKEND_URL};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The address people use, for the sign-in's return address (OPS_SIGNALS_PUBLIC_URL overrides it).
    proxy_set_header X-Forwarded-Host $http_host;
    # The token is added here, server-side, so it never reaches the browser (see the map above); empty
    # is fine while the backend has no token.
    proxy_set_header Authorization $ops_signals_authorization;
    # Only Grafana's plugin proxy may say who a Grafana user is. Requests through the web UI carry the
    # token too, so drop any copy a browser sent (an empty value removes the header). The company
    # sign-in proxy's user headers (OPS_SIGNALS_AUTH_USER_HEADER) pass through unchanged.
    proxy_set_header X-Grafana-Context "";
    proxy_set_header X-Grafana-Id "";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
