# Known-answer questions for Ask Ops Signals. Each one names where the answer lives - a file
# (`source`, the knowledge document's source_path) and, for Markdown docs, the section heading
# (`section`, matched as a substring of the cited section's heading path) - plus phrases the
# answering passage must contain (`contains`, case-insensitive).
#
# `expect` lists every place that is a correct citation; any one of them counts as a hit. Every
# listed section must itself contain every `contains` phrase - test_assistant_golden checks this,
# so a doc edit that moves or removes an answer fails loudly instead of silently lowering the score.
#
# category `out_of_scope`: nothing in the corpus answers the question. Reported, not scored.
# category `known_gap`: the docs answer it but the assistant doesn't cite the right section yet.
# Reported, not scored; the benchmark says when one starts passing, so it can become `docs`.
#
# Questions saved from the Ask Ops Signals Docs check page are appended at the end.

questions:
  # --- Setup and running ------------------------------------------------------------------------
  - id: python-versions
    category: docs
    question: Which Python versions does setup support?
    contains: ["3.13"]
