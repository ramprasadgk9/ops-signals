scenario:
  id: cpu_seasonal_forecast_v1
  name: Seasonal CPU Forecast
  description: >
    Repeated operational CPU motif with a smooth upward trend, intended to
    validate forecast-capable analyzers on seasonal trend behavior.

dataset:
  source: generated
  scenario_dataset: benchmark/scenarios/cpu_seasonal_forecast_v1/dataset.csv
  metric: cpu.usage_user
  interval: 5m

expected_behavior:
  dominant:
    - seasonal
    - repeating_pattern
    - trend

expected_router:
  strict_precision: true
  required_recommended:
    - prophet
  allowed_optional:
    - darts
    - stumpy
    - kats
    - trend_regression
    - ruptures
  forbidden_recommended:
    - river
    - alibi_detect
    - adtk
    - pyod
  required_detected_profiles:
    - seasonal
    - repeating_pattern
    - trend
  forbidden_detected_profiles:
    - baseline_shift
    - regime_change
    - spike

validation:
  router:
    require_all_recommended: true
    fail_on_forbidden_recommended: true

notes:
  - STUMPY and Darts may also be recommended because the current router sees behavior but not forecast task intent.
