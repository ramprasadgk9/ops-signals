# Five-minute demo: one command brings up Ops Signals with a realistic incident already in progress.
#
#   docker compose -f docker-compose.demo.yml up
#
# Then open http://localhost:8080 (Ops Signals) and http://localhost:8090 (the Slack-style
# channel where the enriched alert lands). Full walkthrough: docs/demo.md.
#
# The story (demo/scenario.py): four services of one online shop. checkout-api's latency steps up
# after a deploy and a Prometheus alert fires; Ops Signals finds the deploy and a past case fixed by
# a rollback. payments-db's connection pool runs out again, 9 days after a fix. search-svc ships a
# version nobody announced and its latency and errors jump together. orders sends OTLP, and its
# failed orders climb after a deploy while a case is being worked on.
#
# With AI, from a model running in its own container (downloads about 10 GB the first time and
# needs about 8 GB of memory for Docker):
#   docker compose -f docker-compose.demo.yml --profile ai up
#
# With AI from a model API you already have (nothing to download): copy demo/ai-api.env.example to
# demo/ai-api.env, fill in the URL, key and model, then
#   docker compose -f docker-compose.demo.yml --env-file demo/ai-api.env up
#
# A "Things to try" guide in the corner walks you through it; OPS_SIGNALS_DEMO_TOUR=false hides it.
#
# Start over with a fresh incident:   docker compose -f docker-compose.demo.yml down -v
# Post to a real Slack channel too:   DEMO_SLACK_WEBHOOK_URL=https://hooks.slack.com/... docker compose -f docker-compose.demo.yml up
#
# Runs as its own compose project (no host ports for Postgres/Qdrant), so it doesn't collide with
# the development stack from scripts/run_all.sh.

name: ops-signals-demo

x-backend-image: &backend-image
  image: ghcr.io/ramprasadgk9/ops-signals-backend:${OPS_SIGNALS_VERSION:-latest}
  # Pulls the published image; if it can't (not published yet, offline), builds it locally instead.
  pull_policy: missing
  build:
    context: .
    dockerfile: docker/backend.Dockerfile

x-backend-env: &backend-env
  OPS_SIGNALS_DATABASE_URL: postgresql+psycopg://ops_signals:ops_signals@postgres:5432/ops_signals
  OPS_SIGNALS_QDRANT_URL: http://qdrant:6333
  # So the Analyzer Lab works in the demo; it only writes inside this throwaway container.
  OPS_SIGNALS_ALLOW_FILE_WRITES: "true"

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ops_signals
      POSTGRES_USER: ops_signals
      POSTGRES_PASSWORD: ops_signals
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops_signals -d ops_signals"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image has no curl/wget; bash's /dev/tcp is enough to know the port is open.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    <<: *backend-image
    # AI turns on by itself when you give a model API (DEMO_AI_URL) or the `ai` profile's model
    # server is running, unless you set OPS_SIGNALS_AI_ENABLED yourself; otherwise the backend
    # starts exactly as the image does. The API wins over the `ai` profile.
    command:
      - sh
      - -c
      - |
        if [ -z "$${OPS_SIGNALS_AI_ENABLED}" ] && [ -n "$${DEMO_AI_URL}" ]; then
          if [ -z "$${DEMO_AI_MODEL}" ]; then
            echo "AI stays off: DEMO_AI_URL is set but DEMO_AI_MODEL is empty (see demo/ai-api.env.example)"
          else
            export OPS_SIGNALS_AI_ENABLED=true OPS_SIGNALS_AI_PROVIDER=openai_compatible
            export OPS_SIGNALS_OPENAI_BASE_URL="$${DEMO_AI_URL}" OPS_SIGNALS_OPENAI_MODEL="$${DEMO_AI_MODEL}"
            if [ -n "$${DEMO_AI_KEY}" ]; then export OPS_SIGNALS_OPENAI_API_KEY="$${DEMO_AI_KEY}"; fi
            echo "AI is on: $${DEMO_AI_MODEL} from $${DEMO_AI_URL} (the key is not printed)"
          fi
        elif [ -z "$${OPS_SIGNALS_AI_ENABLED}" ] && getent hosts ollama >/dev/null 2>&1; then
          export OPS_SIGNALS_AI_ENABLED=true OPS_SIGNALS_AI_PROVIDER=ollama
          export OPS_SIGNALS_OLLAMA_URL=http://ollama:11434 OPS_SIGNALS_OLLAMA_MODEL="$${DEMO_AI_MODEL:-gemma3:4b}"
          # The model runs on CPU: 5-20 s an answer, more when several queue.
          export OPS_SIGNALS_OLLAMA_TIMEOUT_SECONDS=90
          echo "AI is on: $${DEMO_AI_MODEL:-gemma3:4b} from the ollama container (--profile ai)"
        fi
        exec uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    environment:
      <<: *backend-env
      OPS_SIGNALS_PROMETHEUS_URL: http://prometheus:9090
      OPS_SIGNALS_ALERT_ENRICHMENT_ENABLED: "true"
      OPS_SIGNALS_ALERT_SLACK_WEBHOOK_URL: ${DEMO_SLACK_WEBHOOK_URL:-http://slack-sink:8090/webhook}
      OPS_SIGNALS_UI_BASE_URL: http://localhost:${DEMO_WEB_PORT:-8080}
      # The embedding model is baked into the image; never reach out to HuggingFace.
      HF_HUB_OFFLINE: "1"
      # Find search-svc's unannounced deploy soon after start (default: every 5 minutes).
      OPS_SIGNALS_DEPLOY_DISCOVERY_INTERVAL_MINUTES: "2"
      # Which pods a change came from (checkout-api: the new pods; search-svc: 1 of 4).
      OPS_SIGNALS_DRILLDOWN_ENABLED: "true"
      # AI is off unless you pass a provider in (docs/demo.md, "Turn on AI"). Empty means "not set".
      OPS_SIGNALS_AI_ENABLED: ${OPS_SIGNALS_AI_ENABLED:-}
      OPS_SIGNALS_AI_PROVIDER: ${OPS_SIGNALS_AI_PROVIDER:-}
      OPS_SIGNALS_OLLAMA_URL: ${OPS_SIGNALS_OLLAMA_URL:-}
      OPS_SIGNALS_OLLAMA_MODEL: ${OPS_SIGNALS_OLLAMA_MODEL:-}
      OPS_SIGNALS_OPENAI_BASE_URL: ${OPS_SIGNALS_OPENAI_BASE_URL:-}
      OPS_SIGNALS_OPENAI_MODEL: ${OPS_SIGNALS_OPENAI_MODEL:-}
      OPS_SIGNALS_OPENAI_API_KEY: ${OPS_SIGNALS_OPENAI_API_KEY:-}
      OPS_SIGNALS_ANTHROPIC_MODEL: ${OPS_SIGNALS_ANTHROPIC_MODEL:-}
      OPS_SIGNALS_ANTHROPIC_API_KEY: ${OPS_SIGNALS_ANTHROPIC_API_KEY:-}
      # The model the backend uses: from DEMO_AI_URL when set, else the one the `ai` profile
      # downloads (gemma3:4b when empty).
      DEMO_AI_MODEL: ${DEMO_AI_MODEL:-}
      # A model API instead of the `ai` profile: any server that speaks the OpenAI chat completions
      # API, URL up to the API root (e.g. .../v1). Key only if it needs one. demo/ai-api.env.example.
      DEMO_AI_URL: ${DEMO_AI_URL:-}
      DEMO_AI_KEY: ${DEMO_AI_KEY:-}
      # Recorded AI answers: replay them (OPS_SIGNALS_AI_PROVIDER=recorded), or record new ones.
      OPS_SIGNALS_AI_RECORDED_FILE: ${OPS_SIGNALS_AI_RECORDED_FILE:-}
      OPS_SIGNALS_AI_RECORD_TO: ${OPS_SIGNALS_AI_RECORD_TO:-}
      # The "Things to try" guide, on by default here. OPS_SIGNALS_DEMO_TOUR=false hides it.
      OPS_SIGNALS_DEMO_TOUR: ${OPS_SIGNALS_DEMO_TOUR:-true}
      # Demo mode, for a hosted public demo (docs/demo.md, "Host it as a public demo"): banner,
      # Things to try, view-only settings, sample files. Off unless set.
      OPS_SIGNALS_DEMO_MODE: ${OPS_SIGNALS_DEMO_MODE:-}
      OPS_SIGNALS_DEMO_RESET_HOURS: ${OPS_SIGNALS_DEMO_RESET_HOURS:-}
      OPS_SIGNALS_DEMO_RUN_YOURSELF_URL: ${OPS_SIGNALS_DEMO_RUN_YOURSELF_URL:-}
    # So a model server on your machine (e.g. Ollama) is reachable as host.docker.internal on Linux
    # too; Docker Desktop already provides it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # The orders team's own analyzer settings ("Custom settings" on its findings).
      - ./demo/config/analyzer-overrides/orders-team.yml:/app/config/analyzer_overrides.d/orders-team.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      # Only with --profile ai: start once the model is downloaded, so AI works from the first click.
      ollama-model:
        condition: service_completed_successfully
        required: false
    networks:
      default:
        # docker/nginx.web.conf proxies /api/ to this name.
        aliases: [ops-signals-backend]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      # First start embeds the bundled docs into Qdrant before the API answers.
      start_period: 300s

  web:
    image: ghcr.io/ramprasadgk9/ops-signals-web:${OPS_SIGNALS_VERSION:-latest}
    pull_policy: missing
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "${DEMO_WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy

  # --- optional: AI from a local model (--profile ai) --------------------------------------------

  # Runs the model on this machine; nothing is sent anywhere. CPU only, so an answer takes 5-20 s
  # depending on the machine. The image is about 7 GB.
  ollama:
    image: ollama/ollama:latest
    profiles: [ai]
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: downloads the model into the ollama volume (about 3 GB for gemma3:4b, once).
  ollama-model:
    image: ollama/ollama:latest
    profiles: [ai]
    entrypoint: ["ollama", "pull", "${DEMO_AI_MODEL:-gemma3:4b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # --- the incident ------------------------------------------------------------------------------

  # Writes the timeline and 7h of checkout-api history (OpenMetrics) into the demo-state volume.
  demo-history:
    image: python:3.12-alpine
    command: ["python", "/demo/backfill_history.py"]
    volumes:
      - ./demo:/demo:ro
      - demo_state:/demo-state
    restart: "no"

  # Turns that history into Prometheus blocks before Prometheus starts, so the analyzers have a
  # baseline to compare against from the first minute.
  prometheus-backfill:
    image: prom/prometheus:v2.54.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -f /prometheus/.demo-backfilled ]; then echo "history already backfilled"; exit 0; fi
        promtool tsdb create-blocks-from openmetrics /demo-state/history.om /prometheus \
          && touch /prometheus/.demo-backfilled
    volumes:
      - demo_state:/demo-state:ro
      - prometheus_data:/prometheus
    depends_on:
      demo-history:
        condition: service_completed_successfully
    restart: "no"

  # Live scrape target that continues the backfilled series.
  demo-metrics:
    image: python:3.12-alpine
    command: ["python", "/demo/metrics_target.py"]
    volumes:
      - ./demo:/demo:ro
      - demo_state:/demo-state:ro
    depends_on:
      demo-history:
        condition: service_completed_successfully
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # So "view rule source" links in the alert message open from the host.
      - "--web.external-url=http://localhost:${DEMO_PROMETHEUS_PORT:-9091}"
    ports:
      - "${DEMO_PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./demo/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./demo/config/alert-rules.yml:/etc/prometheus/rules/demo.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      prometheus-backfill:
        condition: service_completed_successfully
      demo-metrics:
        condition: service_started
    restart: unless-stopped

  # orders sends its metrics over OTLP, as an OpenTelemetry Collector would: 6.5h of history on
  # first start, then a point every 30s.
  demo-otlp:
    image: python:3.12-alpine
    command: ["python", "/demo/otlp_sender.py"]
    volumes:
      - ./demo:/demo:ro
      - demo_state:/demo-state
    depends_on:
      backend:
        condition: service_healthy
      demo-history:
        condition: service_completed_successfully
    restart: unless-stopped

  # Records deploys, past problems, cases and answers through the API, starts the scheduled
  # analysis, and opens the in-progress orders case, then exits.
  demo-seeder:
    <<: *backend-image
    command: ["python", "/demo/seed.py"]
    environment:
      <<: *backend-env
      DEMO_BACKEND_URL: http://backend:8000
      DEMO_WEB_URL: http://localhost:${DEMO_WEB_PORT:-8080}
      DEMO_SLACK_SINK_URL: http://localhost:${DEMO_SLACK_PORT:-8090}
    volumes:
      - ./demo:/demo:ro
      - demo_state:/demo-state
    depends_on:
      backend:
        condition: service_healthy
      demo-history:
        condition: service_completed_successfully
    restart: "no"

  # Starts only once seeding is done, so the alert always reaches a fully seeded backend.
  # Prometheus keeps re-sending the firing alert until Alertmanager is up.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/tmp/alertmanager"
      - "--web.external-url=http://localhost:${DEMO_ALERTMANAGER_PORT:-9094}"
    ports:
      - "${DEMO_ALERTMANAGER_PORT:-9094}:9093"
    volumes:
      - ./demo/config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      demo-seeder:
        condition: service_completed_successfully
    restart: unless-stopped

  # Stand-in for Slack: renders the webhook messages the backend posts.
  slack-sink:
    image: python:3.12-alpine
    command: ["python", "/demo/slack_sink.py"]
    environment:
      SLACK_SINK_STORE: /demo-state/slack-messages.jsonl
    ports:
      - "${DEMO_SLACK_PORT:-8090}:8090"
    volumes:
      - ./demo:/demo:ro
      - demo_state:/demo-state
    restart: unless-stopped

volumes:
  ollama_models:
  postgres_data:
  qdrant_data:
  prometheus_data:
  demo_state:
