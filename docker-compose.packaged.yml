services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ops_signals
      POSTGRES_USER: ops_signals
      POSTGRES_PASSWORD: ops_signals
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops_signals -d ops_signals"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ops-signals-backend:local
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      OPS_INTEL_DATABASE_URL: postgresql+psycopg://ops_signals:ops_signals@postgres:5432/ops_signals
      OPS_SIGNALS_QDRANT_URL: http://qdrant:6333
      OPS_SIGNALS_PROMETHEUS_URL: http://prometheus:9090
      # See docs/security-model.md. Without a token the API is open to anyone who can reach port 8000.
      OPS_SIGNALS_API_TOKEN: ${OPS_SIGNALS_API_TOKEN:-}
      OPS_SIGNALS_ALLOW_FILE_WRITES: ${OPS_SIGNALS_ALLOW_FILE_WRITES:-false}
      OPS_SIGNALS_ENABLE_TESTING_API: ${OPS_SIGNALS_ENABLE_TESTING_API:-false}
    ports:
      - "8000:8000"
    networks:
      default:
        # docker/nginx.web.conf proxies /api/ to this name.
        aliases: [ops-signals-backend]
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  web:
    image: ops-signals-web:local
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      # nginx adds it to every /api/ request, so the browser never sees it.
      OPS_SIGNALS_API_TOKEN: ${OPS_SIGNALS_API_TOKEN:-}
    ports:
      - "8080:8080"
    depends_on:
      - backend

  mcp:
    image: ops-signals-mcp:local
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    environment:
      OPS_INTEL_DATABASE_URL: postgresql+psycopg://ops_signals:ops_signals@postgres:5432/ops_signals
      OPS_SIGNALS_QDRANT_URL: http://qdrant:6333
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
