services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ops_signals
      POSTGRES_USER: ops_signals
      POSTGRES_PASSWORD: ops_signals
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops_signals -d ops_signals"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image has no curl/wget; bash's /dev/tcp is enough to know the port is open.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ops-signals-backend:local
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      OPS_SIGNALS_DATABASE_URL: postgresql+psycopg://ops_signals:ops_signals@postgres:5432/ops_signals
      OPS_SIGNALS_QDRANT_URL: http://qdrant:6333
      # Your Prometheus, as the backend container sees it (a Prometheus on this machine is
      # http://host.docker.internal:9090). For several Mimir tenants, add docker-compose.connections.yml.
      OPS_SIGNALS_PROMETHEUS_URL: ${OPS_SIGNALS_PROMETHEUS_URL:-http://prometheus:9090}
      # See docs/security-model.md. Without a token the API is open to anyone who can reach port 8000.
      OPS_SIGNALS_API_TOKEN: ${OPS_SIGNALS_API_TOKEN:-}
      OPS_SIGNALS_ALLOW_FILE_WRITES: ${OPS_SIGNALS_ALLOW_FILE_WRITES:-false}
      OPS_SIGNALS_ENABLE_TESTING_API: ${OPS_SIGNALS_ENABLE_TESTING_API:-false}
      # Jira ticketing (docs/configuration.md), off unless set in .env; blank values count as unset.
      OPS_SIGNALS_TICKETING_ENABLED: ${OPS_SIGNALS_TICKETING_ENABLED:-false}
      OPS_SIGNALS_JIRA_BASE_URL: ${OPS_SIGNALS_JIRA_BASE_URL:-}
      OPS_SIGNALS_JIRA_EMAIL: ${OPS_SIGNALS_JIRA_EMAIL:-}
      OPS_SIGNALS_JIRA_API_TOKEN: ${OPS_SIGNALS_JIRA_API_TOKEN:-}
      OPS_SIGNALS_JIRA_PROJECT_KEY: ${OPS_SIGNALS_JIRA_PROJECT_KEY:-}
      OPS_SIGNALS_JIRA_ISSUE_TYPE: ${OPS_SIGNALS_JIRA_ISSUE_TYPE:-}
      OPS_SIGNALS_JIRA_WEBHOOK_SECRET: ${OPS_SIGNALS_JIRA_WEBHOOK_SECRET:-}
      # Metric Usage reads your Grafana dashboards and alert rules (.env.example). A Grafana on this
      # machine is http://host.docker.internal:3000, not localhost. Blank values count as unset.
      OPS_SIGNALS_GRAFANA_URL: ${OPS_SIGNALS_GRAFANA_URL:-}
      OPS_SIGNALS_GRAFANA_TOKEN: ${OPS_SIGNALS_GRAFANA_TOKEN:-}
      OPS_SIGNALS_GRAFANA_USERNAME: ${OPS_SIGNALS_GRAFANA_USERNAME:-}
      OPS_SIGNALS_GRAFANA_PASSWORD: ${OPS_SIGNALS_GRAFANA_PASSWORD:-}
      OPS_SIGNALS_GRAFANA_VERIFY_TLS: ${OPS_SIGNALS_GRAFANA_VERIFY_TLS:-}
      OPS_SIGNALS_GRAFANA_TIMEOUT_SECONDS: ${OPS_SIGNALS_GRAFANA_TIMEOUT_SECONDS:-}
      OPS_SIGNALS_METRIC_USAGE_ENABLED: ${OPS_SIGNALS_METRIC_USAGE_ENABLED:-}
      OPS_SIGNALS_METRIC_USAGE_INTERVAL_HOURS: ${OPS_SIGNALS_METRIC_USAGE_INTERVAL_HOURS:-}
      OPS_SIGNALS_METRIC_USAGE_EXCLUDE_FOLDERS: ${OPS_SIGNALS_METRIC_USAGE_EXCLUDE_FOLDERS:-}
      OPS_SIGNALS_METRIC_USAGE_IGNORE_METRICS: ${OPS_SIGNALS_METRIC_USAGE_IGNORE_METRICS:-}
      OPS_SIGNALS_METRIC_USAGE_PROBLEM_WINDOW_HOURS: ${OPS_SIGNALS_METRIC_USAGE_PROBLEM_WINDOW_HOURS:-}
      OPS_SIGNALS_METRIC_USAGE_KEEP_SNAPSHOTS: ${OPS_SIGNALS_METRIC_USAGE_KEEP_SNAPSHOTS:-}
      OPS_SIGNALS_METRIC_USAGE_COST_PER_1K_SERIES: ${OPS_SIGNALS_METRIC_USAGE_COST_PER_1K_SERIES:-}
      OPS_SIGNALS_METRIC_USAGE_CURRENCY: ${OPS_SIGNALS_METRIC_USAGE_CURRENCY:-}
    ports:
      - "8000:8000"
    # Lets the backend reach a Prometheus on this machine as host.docker.internal on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        # docker/nginx.web.conf proxies /api/ to this name.
        aliases: [ops-signals-backend]
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  web:
    image: ops-signals-web:local
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      # nginx adds it to every /api/ request, so the browser never sees it.
      OPS_SIGNALS_API_TOKEN: ${OPS_SIGNALS_API_TOKEN:-}
    ports:
      - "8080:8080"
    depends_on:
      - backend

  mcp:
    image: ops-signals-mcp:local
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    environment:
      OPS_SIGNALS_DATABASE_URL: postgresql+psycopg://ops_signals:ops_signals@postgres:5432/ops_signals
      OPS_SIGNALS_QDRANT_URL: http://qdrant:6333
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
