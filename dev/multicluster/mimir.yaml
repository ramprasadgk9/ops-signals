# Single-process Grafana Mimir for local multi-cluster testing (scripts/multicluster.sh).
# Not for production: one replica, filesystem storage.
multitenancy_enabled: true

server:
  http_listen_port: 9009
  grpc_listen_port: 9095
  log_level: warn

common:
  storage:
    backend: filesystem
    filesystem:
      dir: /data/storage

blocks_storage:
  storage_prefix: blocks
  tsdb:
    dir: /data/tsdb
  bucket_store:
    sync_dir: /data/tsdb-sync
    # The compactor refreshes the bucket index only while its ring entry is healthy; a laptop sleep
    # stops heartbeats, and queries then fail with err-mimir-bucket-index-too-old after the default 1h.
    bucket_index:
      max_stale_period: 168h

compactor:
  data_dir: /data/compactor
  # Refresh the bucket index soon after waking up, instead of the default 15m.
  cleanup_interval: 5m
  sharding_ring:
    kvstore:
      store: memberlist

distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist

ingester:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist
    replication_factor: 1

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/rules

store_gateway:
  sharding_ring:
    replication_factor: 1

limits:
  # The backfill writes days of history at once, and live data then arrives alongside it.
  out_of_order_time_window: 168h
  # Backfilled history stays in the ingester until it is shipped as blocks; ask the ingester for
  # all time instead of only the last 13h, so the whole backfill is queryable immediately.
  query_ingesters_within: 0s
  ingestion_rate: 1000000
  ingestion_burst_size: 2000000
  max_global_series_per_user: 0
  compactor_blocks_retention_period: 30d
  # HA dedup (the HA tracker) is left off on purpose: both copies of the eu replica pair are
  # stored, so Ops Signals' own replica handling is what gets exercised.
