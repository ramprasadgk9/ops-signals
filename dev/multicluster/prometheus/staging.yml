# Prometheus "staging" for the local multi-cluster Mimir setup (scripts/multicluster.sh).
# external_labels mark every sample it sends to Mimir, the way a real cluster's Prometheus does.
global:
  scrape_interval: 15s
  external_labels:
    cluster: staging

scrape_configs:
  - job_name: cluster-metrics
    static_configs:
      - targets: ["metrics-staging:9100"]

remote_write:
  - url: http://mimir:9009/api/v1/push
    headers:
      X-Scope-OrgID: team-b
