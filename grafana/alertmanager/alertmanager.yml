# Local Alertmanager for trying alert enrichment. Everything goes to the Ops Signals receiver on
# the host on run_all.sh's default port 8001 (run_all.sh generates a copy for other BACKEND_PORTs).
# In a real setup, keep your existing receivers and add Ops Signals as an extra route
# with `continue: true` - see docs/design/alert-enrichment-plan.md.
route:
  receiver: ops-signals
  group_by: [alertname, service]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: ops-signals
    webhook_configs:
      - url: http://host.docker.internal:8001/api/integrations/alertmanager
        send_resolved: true
        # If OPS_SIGNALS_ALERT_RECEIVER_TOKEN is set on the backend:
        # http_config:
        #   authorization:
        #     credentials: <same token>
