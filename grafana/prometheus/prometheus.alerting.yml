# Same as prometheus.yml, plus demo alert rules, an Alertmanager target and the Ops Signals backend.
# Used only by docker-compose.alerting.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: ops-signals-mock
    metrics_path: /metrics
    static_configs:
      - targets:
          - mock-metrics:9101

  # scripts/demo_live.py serves per-pod demo metrics here while it runs (down otherwise; no rule
  # alerts on it). Scraped every 5s so the live demo needs minutes of history, not hours.
  - job_name: ops-signals-live-demo
    scrape_interval: 5s
    static_configs:
      - targets:
          - host.docker.internal:9105

  # The web UI backend's findings metrics (docs/finding-metrics.md). Only one backend: the plugin
  # backend (8002) shares the database and would count every finding twice. Down while the backend
  # isn't running, or when OPS_SIGNALS_API_TOKEN is set (this job sends no token).
  - job_name: ops-signals
    metrics_path: /api/metrics
    static_configs:
      - targets:
          - host.docker.internal:8001
