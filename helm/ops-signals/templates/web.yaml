apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ops-signals.fullname" . }}-web
  labels:
    {{- include "ops-signals.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            # nginx stops adding the API token when people sign in themselves (mode oidc).
            - name: OPS_SIGNALS_AUTH_MODE
              value: {{ .Values.security.signIn.mode | default "none" | quote }}
          {{- with include "ops-signals.apiTokenEnv" . }}
            {{- . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ops-signals.fullname" . }}-web
  labels:
    {{- include "ops-signals.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: 8080
