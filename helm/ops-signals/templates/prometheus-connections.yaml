{{- if .Values.prometheusConnections.config }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ops-signals.fullname" . }}-prometheus-connections
  labels:
    {{- include "ops-signals.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  connections.yaml: |
    {{- toYaml .Values.prometheusConnections.config | nindent 4 }}
{{- end }}
