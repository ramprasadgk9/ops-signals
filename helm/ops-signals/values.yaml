nameOverride: ""
fullnameOverride: ""

# See docs/security-model.md. The API has no auth unless a token is set, so either set one or keep the
# backend on a trusted network.
security:
  # An existing Secret holding the API token. The backend requires it on every request; the web UI's
  # nginx adds it server-side. Empty name = no token.
  apiTokenSecret:
    name: ""
    key: api-token
  # Lets the analyzer and behavior labs write registrations, adapter code and definition packs on
  # the backend's filesystem.
  allowFileWrites: false
  # POST /api/testing/reset-operational-data - wipes all findings, cases and memory.
  enableTestingApi: false
  # Comma-separated origins allowed to call the API from a browser (e.g. your Grafana URL). Empty =
  # the built-in localhost defaults.
  corsOrigins: ""

# Postgres connection used by the backend and the MCP server. Set urlSecret.name to read the URL
# from an existing Secret instead (recommended outside local testing): the plain url below then
# isn't used, so no credentials end up in your values.
database:
  url: postgresql+psycopg://ops_signals:ops_signals@ops-signals-postgres:5432/ops_signals
  urlSecret:
    name: ""
    key: database-url

backend:
  image:
    repository: ghcr.io/ramprasadgk9/ops-signals-backend
    # Empty = the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    type: ClusterIP
    port: 8000
  env:
    OPS_SIGNALS_QDRANT_URL: http://ops-signals-qdrant:6333
    OPS_SIGNALS_PROMETHEUS_URL: http://prometheus-server:9090

# Several Prometheus connections - typically one per Mimir tenant. Empty = the single connection
# OPS_SIGNALS_PROMETHEUS_URL above describes. See docs/standalone-prometheus-analysis.md
# ("Several tenants: named connections") for every field.
prometheusConnections:
  # The connections file, as YAML. Rendered into a ConfigMap and mounted into the backend.
  # Keep secrets out: write `bearer_token: ${MIMIR_TEAM_A_TOKEN}` and put the value in the Secret below.
  config: {}
  #   default: team-a
  #   connections:
  #     - id: team-a
  #       name: Mimir team A
  #       base_url: http://mimir-query-frontend.mimir:8080/prometheus
  #       bearer_token: ${MIMIR_TEAM_A_TOKEN}
  #       headers:
  #         X-Scope-OrgID: team-a
  #       match_labels:
  #         tenant: team-a
  # An existing Secret whose keys become environment variables of the backend, e.g. a key
  # MIMIR_TEAM_A_TOKEN for the ${MIMIR_TEAM_A_TOKEN} reference above. Empty = none.
  secretName: ""

web:
  image:
    repository: ghcr.io/ramprasadgk9/ops-signals-web
    # Empty = the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    type: ClusterIP
    port: 8080

mcp:
  image:
    repository: ghcr.io/ramprasadgk9/ops-signals-mcp
    # Empty = the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  env:
    OPS_SIGNALS_QDRANT_URL: http://ops-signals-qdrant:6333

ingress:
  enabled: false
  className: ""
  host: ops-signals.local
  annotations: {}
  tls: []
