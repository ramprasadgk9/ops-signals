[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-signals"
version = "0.6.0"
description = "Vendor-neutral operational intelligence: explainable findings, cases and operational memory from time-series metrics"
readme = "README.md"
authors = [
    { name = "Ramprasad Goturkarnam" },
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["observability", "anomaly-detection", "time-series", "prometheus", "aiops", "incident-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "pandas>=3.0.3",
    "numpy>=2.4.0",
    "statsmodels>=0.14.6",
    "stumpy>=1.13.0",
    "pyod>=3.0.0",
    "PyYAML>=6.0.3",
    "matplotlib>=3.10.0",
    "ruptures>=1.1.9",
    "SQLAlchemy>=2.0.51",
    "psycopg[binary]>=3.3.4",
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "pydantic>=2.11.7",
    "python-multipart>=0.0.20",
    "sentence-transformers>=5.0.0",
    "qdrant-client>=1.18.0",
    "anthropic>=1.11.0",
    "opentelemetry-proto>=1.30.0",
    "prometheus_client>=0.21.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "watchfiles>=0.24.0", "pytest-cov>=6.0.0"]

[project.urls]
Homepage = "https://github.com/ramprasadgk9/ops-signals"
Documentation = "https://github.com/ramprasadgk9/ops-signals/tree/main/docs"
Issues = "https://github.com/ramprasadgk9/ops-signals/issues"
Changelog = "https://github.com/ramprasadgk9/ops-signals/blob/main/CHANGELOG.md"

[project.scripts]
ops-signals = "intelligence.cli:main"

[tool.setuptools.packages.find]
# experiments.analyzer_router is the production router the backend imports; the rest of
# experiments/ is exploratory and stays out of the package.
include = ["intelligence*", "backend*", "experiments", "experiments.analyzer_router"]

[tool.setuptools.package-data]
backend = ["migrations/*.sql", "app/case_import/templates/*"]
"experiments.analyzer_router" = ["*.yaml"]

[tool.pytest.ini_options]
# Scope discovery to tests/ — scripts/ holds manual CLI scripts (some, e.g.
# test_gemma_analyzer_advisor.py, happen to be named test_*.py and were being swept into
# collection, colliding with the real test of the same name under tests/api_backend/).
testpaths = ["tests"]

[tool.coverage.run]
source = ["backend", "intelligence"]

[tool.coverage.report]
skip_empty = true
