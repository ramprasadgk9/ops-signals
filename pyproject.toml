[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-signals"
version = "0.1.0"
description = "Batch Operational Signal Engine MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0.3",
    "numpy>=2.5.1",
    "statsmodels>=0.14.6",
    "stumpy>=1.13.0",
    "pyod>=3.0.0",
    "PyYAML>=6.0.3",
    "matplotlib>=3.10.0",
    "ruptures>=1.1.9",
    "SQLAlchemy>=2.0.51",
    "psycopg[binary]>=3.3.4",
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "pydantic>=2.11.7",
    "python-multipart>=0.0.20",
    "sentence-transformers>=5.0.0",
    "pytest>=9.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[project.scripts]
ops-signals = "intelligence.cli:main"

[tool.setuptools]
packages = ["intelligence"]

[tool.setuptools.package-data]
intelligence = []

[tool.pytest.ini_options]
# Scope discovery to tests/ — scripts/ holds manual CLI scripts (some, e.g.
# test_gemma_analyzer_advisor.py, happen to be named test_*.py and were being swept into
# collection, colliding with the real test of the same name under tests/api_backend/).
testpaths = ["tests"]
addopts = [
    # tests/test_tsbs_benchmark.py imports benchmark.scripts.tsbs_benchmark, which does not exist
    # anywhere in the repo (confirmed 2026-09-09) — orphaned, not something this fix should guess
    # the contents of. Tracked as a known gap; remove this ignore once it's restored or rewritten.
    "--ignore=tests/test_tsbs_benchmark.py",
]
