[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-signals"
version = "0.1.0"
description = "Batch Operational Signal Engine MVP"
readme = "README.md"
authors = [
    { name = "Ramprasad Goturkarnam" },
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0.3",
    "numpy>=2.5.1",
    "statsmodels>=0.14.6",
    "stumpy>=1.13.0",
    "pyod>=3.0.0",
    "PyYAML>=6.0.3",
    "matplotlib>=3.10.0",
    "ruptures>=1.1.9",
    "SQLAlchemy>=2.0.51",
    "psycopg[binary]>=3.3.4",
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "pydantic>=2.11.7",
    "python-multipart>=0.0.20",
    "sentence-transformers>=5.0.0",
    "pytest>=9.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "watchfiles>=0.24.0", "pytest-cov>=6.0.0"]

[project.scripts]
ops-signals = "intelligence.cli:main"

[tool.setuptools]
packages = ["intelligence"]

[tool.setuptools.package-data]
intelligence = []

[tool.pytest.ini_options]
# Scope discovery to tests/ — scripts/ holds manual CLI scripts (some, e.g.
# test_gemma_analyzer_advisor.py, happen to be named test_*.py and were being swept into
# collection, colliding with the real test of the same name under tests/api_backend/).
testpaths = ["tests"]

[tool.coverage.run]
source = ["backend", "intelligence"]

[tool.coverage.report]
skip_empty = true
