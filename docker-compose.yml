services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: ops-signals-postgres
    environment:
      POSTGRES_DB: ops_signals
      POSTGRES_USER: ops_signals
      POSTGRES_PASSWORD: ops_signals
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops_signals -d ops_signals"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ops-intelligence-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  mock-metrics:
    image: python:3.12-alpine
    container_name: ops-signals-mock-metrics
    working_dir: /workspace
    command: ["python", "dev/mock_prometheus_target.py"]
    ports:
      - "9101:9101"
    volumes:
      - ./:/workspace:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ops-signals-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./grafana/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - mock-metrics
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0
    container_name: ops-signals-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: ops-signals-app
    volumes:
      - ./frontend/dist:/var/lib/grafana/plugins/ops-signals-app:ro
      - ./grafana/provisioning/plugins:/etc/grafana/provisioning/plugins:ro
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - postgres
      - qdrant
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  prometheus_data:
