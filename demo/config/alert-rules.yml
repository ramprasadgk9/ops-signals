groups:
  - name: ops-signals-demo
    rules:
      - alert: CheckoutApiLatencyHigh
        # Per service, not per pod: one alert for checkout-api, and the query Ops Signals reads
        # from it can be split by pod for the "Where" line.
        expr: avg by (service, env) (request_latency_p95{service="checkout-api"}) > 280
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "checkout-api p95 latency above 280ms"
